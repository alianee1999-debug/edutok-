<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طرق التحليل الكيميائي ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#ecefee;--panel:#ffffff;--fg:#141c1e;--muted:#5b686b;--line:#d2dbdc;--accent:#0e6b60;
  --f-title:"Amiri","Noto Naskh Arabic",serif;--f-body:"Noto Naskh Arabic",serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:var(--f-title);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.25}
.lede{margin:2px 0 0;color:var(--muted);line-height:1.8;max-width:64ch}
.list{display:flex;flex-direction:column;gap:14px;min-width:0}
.grp h2{font-family:var(--f-title);font-size:22px;margin:0 0 6px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;text-align:start}
.item small{display:block;color:var(--muted);font-size:12px}
.item.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item:focus-visible,.btn:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.player{position:static;order:-1}}
.screen{position:relative;background:#05090c;aspect-ratio:9/16;width:100%;max-width:100%;touch-action:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;z-index:3}
.cover span{width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;background:rgba(0,0,0,.35)}
.cover svg{width:30px;height:30px;margin-left:5px}
.controls{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;height:36px;min-width:36px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted);direction:ltr}
.bar{flex:1 1 120px;min-width:0;height:26px;position:relative;cursor:pointer;touch-action:none}
.bar .track{position:absolute;inset:11px 0;background:var(--line);border-radius:4px}
.bar .fill{position:absolute;top:11px;bottom:11px;right:0;background:var(--accent);border-radius:4px}
.hint{color:var(--muted);font-size:13.5px;padding:0 12px 12px;margin:0}
.err{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;z-index:4;background:#05090c}
</style>

<style>
html.embed,html.embed body{margin:0;background:#05090c;height:100%;overflow:hidden}
html.embed .wrap{display:block;max-width:none;padding:0;margin:0}
html.embed header,html.embed .list,html.embed .hint{display:none!important}
html.embed .player{position:static;border:0;border-radius:0;background:#05090c;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
html.embed .screen{width:min(100vw,calc((100dvh - 56px) * 9 / 16));max-width:100vw;flex:0 0 auto}
html.embed .controls{width:min(100vw,calc((100dvh - 56px) * 9 / 16));border-top:0;padding:8px 10px;background:#05090c;color:#e6ecea}
html.embed .controls .btn{color:#e6ecea;border-color:#2a3a3e}
html.embed .bar .track{background:#2a3a3e}
</style>
<script>(function(){try{if(location.hash.length>1||window.self!==window.top)document.documentElement.classList.add('embed');}catch(e){document.documentElement.classList.add('embed');}})();</script>
<div class="wrap" dir="rtl">
  <header>
    <h1>الفصل السادس: طرق التحليل الكيميائي</h1>
    <p class="lede">أمثلة الفصل وتمارينه بمختبر ثلاثي الأبعاد: أنابيب اختبار تتكوّن فيها الرواسب بألوانها، وميزان حساس يتغيّر وزنه أثناء التسخين، وسحاحة تنقط في دورق حتى يتغيّر لون الكاشف عند نقطة نهاية التسحيح.</p>
  </header>
  <div class="list" id="list"></div>
  <div class="player">
    <div class="screen" id="screen">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ov" width="720" height="1280" aria-label="حل المسألة"></canvas>
      <button class="cover" id="cover" aria-label="تشغيل"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play" aria-label="تشغيل"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5l11 7-11 7z"/></svg></button>
      <div class="bar" id="bar" tabindex="0" role="slider" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuenow="0"><div class="track"></div><div class="fill" id="fill" style="width:0"></div></div>
      <span class="time" id="time">0:00</span>
    </div>
    <p class="hint">ضغطة خفيفة للتشغيل والإيقاف، وسحب لتدوير المشهد.</p>
  </div>
</div>

": 226, "kind": "ice", "qCam": "bal", "ansCam": "bal", "tipCam": "bal", "q": "عند حرق 5.7 mg من مركب عضوي نتج 14.4 mg من غاز ثنائي أوكسيد الكاربون و2.5 mg من بخار الماء. احسب النسبة المئوية للكاربون والهيدروجين في المركب.", "eqs": [], "steps": [{"t": "نحرق العينة", "m": ["m = 5.7 mg"], "cam": "bal", "bal": {"v1": 5.7, "dp": 1, "u": "mg", "heat": true, "gas": true, "lab": "C_{x}H_{y}", "col": "#5a4632"}}, {"t": "الكاربون من CO₂", "m": ["m_{C} = 14.4 × 12 ÷ 44 = 3.93 mg", "% C = 3.93 ÷ 5.7 × 100 = 68.9 %"], "cam": "bal", "bal": {"v0": 14.4, "v1": 3.93, "dp": 2, "u": "mg", "lab": "C", "col": "#2b2d30", "f1": 0.4}}, {"t": "الهيدروجين من H₂O", "m": ["m_{H} = 2.5 × 2 ÷ 18 = 0.278 mg", "% H = 0.278 ÷ 5.7 × 100 = 4.9 %"], "cam": "bal", "bal": {"v0": 2.5, "v1": 0.278, "dp": 3, "u": "mg", "lab": "H", "col": "#f2f5f8", "f1": 0.15}}], "answer": ["% C = 68.9 %", "% H = 4.9 %"], "answerNote": "يطابق جواب الكتاب", "tip": "C من CO₂ بالنسبة 12/44 ، وH من H₂O بالنسبة 2/18"}, {"id": "Q6-8", "label": "سؤال 6-8", "page": 226, "kind": "ice", "qCam": "bur", "ansCam": "bur", "tipCam": "bur", "q": "ما هي مولارية محلول حامض الهيدروكلوريك؟ إذا علمت أن 36.7 mL من محلول هذا الحامض تكافئ 43.2 mL من محلول 0.236 M هيدروكسيد الصوديوم.", "eqs": ["HCl + NaOH ⟶ NaCl + H_{2}O"], "steps": [{"t": "نسحّح حتى نقطة النهاية", "m": ["V_{NaOH} = 43.2 mL"], "cam": "bur", "bur": {"v0": 0, "v1": 43.2, "dur": 6, "end": true, "c0": "#f4f8fb", "c1": "#ff7ac8", "lab": "NaOH 0.236 M", "flab": "HCl 36.7 mL"}}, {"t": "النسبة 1 : 1 فـ M₁V₁ = M₂V₂", "m": ["M_{HCl} = 43.2 × 0.236 ÷ 36.7 = 0.278 M"], "cam": "bur", "bur": {"v0": 43.2, "v1": 43.2, "c0": "#ff7ac8", "lab": "NaOH", "flab": "HCl"}}], "answer": ["M_{HCl} = 0.278 M"], "answerNote": "يطابق جواب الكتاب", "tip": "عند التكافؤ: مليمولات الحامض = مليمولات القاعدة"}, {"id": "Q6-9", "label": "سؤال 6-9", "page": 227, "kind": "ice", "qCam": "bal", "ansCam": "bur", "tipCam": "bur", "q": "ما هي مولارية وعيارية محلول هيدروكسيد الباريوم المحضر بإذابة 9.5 g من هذه المادة في 2 L م  mmol", "V = 0.8 ÷ 0.2 = 4 mL"], "cam": "bur", "bur": {"v0": 0, "v1": 4, "end": true, "tc": "#8a2be2", "c0": "#e8f3d8", "c1": "#f6b8e0", "lab": "KMnO_{4}", "flab": "FeSO_{4}"}}], "answer": ["V = 4 mL"], "answerNote": "يطابق جواب الكتاب", "tip": "البرمنكنات كاشف لنفسها: يظهر اللون البنفسجي الفاتح عند النهاية"}, {"id": "Q6-12-1", "label": "سؤال 6-12 (1)", "page": 227, "kind": "ice", "qCam": "tubes", "ansCam": "tubes", "tipCam": "tubes", "q": "قيمة η لملح كبريتات الحديد (III) Fe₂(SO₄)₃ المستعمل في تفاعل ترسيب أيون الرصاص هي:", "eqs": [], "opts": ["(أ) 4 eq/mol", "(ب) 5 eq/mol", "(ج) 6 eq/mol"], "steps": [{"t": "في تفاعلات الترسيب: η = عدد الأيونات الموجبة × تكافؤها", "m": ["η = 2 × 3 = 6 eq/mol"], "cam": "tubes", "tubes": [{"ion": "Pb^{2+} + SO_{4}^{2−}", "ppt": "#f6f6f6", "lab": "PbSO_{4}"}]}], "answerT": ["η = 6 eq/mol", "الاختيار (ج)"], "tip": "ذرتا حديد بتكافؤ 3"}, {"id": "Q6-12-2", "label": "سؤال 6-12 (2)", "page": 227, "kind": "ice", "qCam": "tubes", "ansCam": "tubes", "tipCam": "tubes", "q": "يمكن فصل أيون Cu²⁺ عن أيون Ca²⁺ وذلك بإضافة: (أ) حامض HCl المخفف (ب) إمرار H₂S بوجود NH₄OH و NH₄Cl (ج) إمرار H₂S بوجود HCl المخفف", "eqs": [], "steps": [{"t": "H₂S في وسط حامضي يرسب Cu²⁺ (المجموعة الثانية) ويبقى Ca²⁺", "m": ["Cu^{2+} + H_{2}S ⟶ CuS↓ + 2H^{+}"], "cam": "tubes", "tubes": [{"ion": "Cu^{2+}", "ppt": "#1a1a1a", "lab": "CuS"}, {"ion": "Ca^{2+}", "sol": "#eef4f8"}]}], "answerT": ["الاختيار (ج)"], "tip": "Ca²⁺ من المجموعة الرابعة فلا يترسب بـ H₂S"}, {"id": "Q6-12-3", "label": "سؤال 6-12 (3)", "page": 227, "kind": "ice", "qCam": "bal", "ansCam": "bal", "tipCam": "bal", "q": "النسبة المئوية لمبيد الحشرات (DDT) C₁₄H₉Cl₅ في عينة غير نقية منه، تم تحليل 0.74 g منها وزنيًا لتعطي 0.253 g من AgCl هي: (أ) 17% (ب) 19% (ج) 21%", "eqs": [], "steps": [{"t": "كل جزيء DDT فيه 5 ذرات كلور ← a = 1 ، b = 5", "m": ["G_{f} = 354.5 ÷ (5 × 143.5) = 0.494"], "cam": "bal", "bal": {"v1": 0.253, "lab": "AgCl", "col": "#f6f6f6"}}, {"t": "كتلة DDT ونسبتها", "m": ["m = 0.494 × 0.253 = 0.125 g",
