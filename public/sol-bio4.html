<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأحياء: التكوين الجنيني ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#ecefee;--panel:#ffffff;--fg:#141c1e;--muted:#5b686b;--line:#d2dbdc;--accent:#0e6b60}
@media (prefers-color-scheme: dark){:root{--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","DejaVu Sans",serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:"Amiri",serif;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.25}
.lede{margin:2px 0 0;color:var(--muted);line-height:1.8;max-width:64ch}
.list{display:flex;flex-direction:column;gap:14px;min-width:0}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;text-align:start}
.item small{display:block;color:var(--muted);font-size:12px}
.item.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px}
@media (max-width:860px){.player{position:static;order:-1}}
.screen{position:relative;background:#05090c;aspect-ratio:9/16;width:100%;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;cursor:pointer}
.cover span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.cover svg{width:40px;height:40px}
.controls{display:flex;align-items:center;gap:12px;padding:10px 14px}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn svg{width:20px;height:20px;fill:#fff}
.bar{flex:1;height:30px;position:relative;cursor:pointer;direction:rtl}
.bar .track{position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line);border-radius:2px}
.bar .fill{position:absolute;top:13px;right:0;height:4px;background:var(--accent);border-radius:2px}
.time{font:12px ui-monospace,monospace;color:var(--muted);direction:ltr;min-width:74px;text-align:end}
.hint{margin:0;padding:0 14px 12px;font-size:12px;color:var(--muted)}
/* وضع التضمين داخل تطبيق EduTok: بدون عنوان ولا قائمة ولا أزرار، المشهد فقط */
html.embed,html.embed body{background:#04121a;margin:0;padding:0;overflow:hidden;height:100%}
html.embed .wrap{display:block;max-width:none;padding:0;margin:0}
html.embed header,html.embed .list,html.embed .controls,html.embed .cover,html.embed .hint{display:none!important}
html.embed .player{border:0;border-radius:0;position:static;background:#04121a;height:100vh;height:100dvh}
html.embed .screen{aspect-ratio:auto;height:100%;width:100%}
html.embed .screen canvas{object-fit:contain}
.eprog{display:none}
html.embed .eprog{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:5}
html.embed .eprog i{position:absolute;top:0;bottom:0;right:0;width:0;background:#5fcab9}
</style>
</head>
<body>
<div class="wrap" dir="rtl">
  <header>
    <h1>الأحياء: التكوين الجنيني</h1>
    <p class="lede">مقاطع تفاعلية مجسّمة للفصل الثالث (التكاثر) من كتاب الأحياء. اختر المقطع من القائمة، واسحب على الشاشة لتدوير المجسّم.</p>
  </header>
  <div class="list" id="list"><div class="items" id="items"></div></div>
  <div class="player">
    <div class="screen" id="screen">
      <canvas id="cv" width="720" height="1280" aria-label="مقطع تعليمي مجسّم"></canvas>
      <div class="eprog"><i id="eprogi"></i></div>
      <button class="cover" id="cover" aria-label="تشغيل"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play" aria-label="تشغيل"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5l11 7-11 7z"/></svg></button>
      <div class="bar" id="bar" tabindex="0" role="slider" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuenow="0"><div class="track"></div><div class="fill" id="fill" style="width:0"></div></div>
      <span class="time" id="time">0:00</span>
    </div>
    <p class="hint">ضغطة خفيفة للتشغيل والإيقاف، وسحب لتدوير المجسّم.</p>
  </div>
</div>

<script>
(function(){
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED)document.documentElement.classList.add('embed');
const W=720,H=1280;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,u)=>a+(b-a)*u,smooth=u=>u*u*u*(u*(u*6-15)+10);
const fin=(t,a,b,f=.5)=>Math.min(clamp((t-a)/f),1-clamp((t-b+f)/f));
let seed=5;const rng=()=>(seed=(seed*16807)%2147483647)/2147483647;
const FT='"Amiri","Noto Naskh Arabic","DejaVu Sans",serif',FB='"Noto Naskh Arabic","DejaVu Sans",sans-serif',FL='"IBM Plex Mono","DejaVu Sans",monospace';

// ================= نص عربي على Canvas =================
function wrap(text,maxW,font,dir){ctx.font=font;ctx.direction=dir||'rtl';const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;}
function txt(text,x,y,o){o=o||{};const size=o.size||34,color=o.color||'#fff',weight=o.weight||'600',maxW=o.maxW||620,lh=o.lh||1.5,alpha=o.alpha===undefined?1:o.alpha,font=o.font||FB,dir=o.dir||'rtl',align=o.align||'center';
  if(alpha<=0)return 0;const f=weight+' '+size+'px '+font;const lines=wrap(text,maxW,f,dir);
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction=dir;ctx.font=f;
  if(o.shadow){ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;}
  const h=lines.length*size*lh;lines.forEach((l,i)=>ctx.fillText(l,x,y-h/2+size*lh*(i+.5)));ctx.restore();return h;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function subtitle(text,a){if(a<=0)return;const size=32,maxW=590;const lines=wrap(text,maxW,'600 '+size+'px '+FB,'rtl');const h=lines.length*size*1.55+40;
  ctx.save();ctx.globalAlpha=a*.92;ctx.fillStyle='rgba(2,14,20,.72)';rrect(40,1232-h,640,h,26);ctx.fill();ctx.strokeStyle='rgba(95,202,185,.35)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  txt(text,360,1232-h/2,{size,maxW,alpha:a,lh:1.55,weight:'600'});}
function head(ar,en,a){txt(ar,360,150,{size:ar.length>19?44:ar.length>14?50:58,weight:'700',font:FT,alpha:a,shadow:1});if(en)txt(en,360,222,{size:32,color:'#5fcab9',dir:'ltr',alpha:a,font:FL,weight:'500'});}

// ================= خلفية =================
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06202b');g.addColorStop(.55,'#0a3a44');g.addColorStop(1,'#071a22');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.fillStyle='#bfeee6';for(let i=0;i<46;i++){const x=(i*127+t*(6+i%5*3))%W,y=(i*211+(t*(4+i%4*2)*(i%2?-1:1))+H*4)%H,r=1.5+(i%4);ctx.globalAlpha=.07+.05*((i%3));ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}ctx.restore();}

// ================= محرك مجسّمات بسيط (Canvas 2D) =================
let yaw=0,pitch=-.25,userYaw=0,userPitch=0;
const spr=new Map();
function sprite(c){const k=c.join(',');if(spr.has(k))return spr.get(k);const S=96,cc=document.createElement('canvas');cc.width=cc.height=S;const x=cc.getContext('2d');
  const g=x.createRadialGradient(S*.36,S*.33,S*.04,S/2,S/2,S/2);
  const L=v=>Math.min(255,v*1.25+60)|0;g.addColorStop(0,'rgb('+L(c[0])+','+L(c[1])+','+L(c[2])+')');g.addColorStop(.55,'rgb('+c[0]+','+c[1]+','+c[2]+')');g.addColorStop(1,'rgb('+(c[0]*.42|0)+','+(c[1]*.42|0)+','+(c[2]*.42|0)+')');
  x.fillStyle=g;x.beginPath();x.arc(S/2,S/2,S/2-1,0,7);x.fill();spr.set(k,cc);return cc;}
function P(x,y,z,cx,cy,s){const cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let X=x*cyw+z*syw,Z=-x*syw+z*cyw;const Y=y*cp-Z*sp;Z=y*sp+Z*cp;const f=1100/(1100+Z*s);return {x:cx+X*s*f,y:cy+Y*s*f,z:Z,f:s*f};}
let items=[];
function ball(x,y,z,r,col,a,cx,cy,s){const p=P(x,y,z,cx,cy,s);items.push({z:p.z,p,r,col,a});return p;}
function flush(){items.sort((a,b)=>b.z-a.z);for(const it of items){const R=it.r*it.p.f;if(R<.4)continue;ctx.globalAlpha=it.a;ctx.drawImage(sprite(it.col),it.p.x-R,it.p.y-R,R*2,R*2);}ctx.globalAlpha=1;items=[];}
function fib(n,R){const o=[];const ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),th=ga*i;o.push([Math.cos(th)*r*R,y*R,Math.sin(th)*r*R]);}return o;}

// ---------- نموذج الخلية حقيقية النواة ----------
const NUC=[-45,-25,15];
const EUK={memb:fib(280,262),env:fib(120,100).map(p=>[p[0]+NUC[0],p[1]+NUC[1],p[2]+NUC[2]]),mito:[],er:[],golgi:[],ribo:[],ves:[],chrom:[]};
[[[140,70,-50],[.8,.5,.3]],[[-135,105,75],[.3,-.9,.2]],[[45,150,-120],[-.9,.2,.4]],[[-110,-120,-90],[.7,-.3,.6]]].forEach(m=>{const d=m[1],n=Math.hypot(d[0],d[1],d[2]);const ch=[];for(let k=-2;k<=2;k++){const u=k/2;ch.push([m[0][0]+d[0]/n*u*58,m[0][1]+d[1]/n*u*58,m[0][2]+d[2]/n*u*58,k===-2||k===2?16:22]);}EUK.mito.push(ch);});
for(let k=0;k<=70;k++){const h=-.94+1.88*k/70,ang=k*.52,rr=Math.sqrt(1-h*h);EUK.er.push([NUC[0]+128*rr*Math.cos(ang),NUC[1]+128*h,NUC[2]+128*rr*Math.sin(ang)]);}
for(let k=0;k<4;k++){const arc=[];for(let i=-4;i<=4;i++){const u=i/4;arc.push([110+u*72+k*8,-118-u*u*20+k*22,60+k*10]);}EUK.golgi.push(arc);}
for(let i=0;i<70;i++){const p=fib(1,1)[0];const a=rng()*6.28,b=Math.acos(2*rng()-1),r=40+rng()*185;const q=[r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)];if(Math.hypot(q[0]-NUC[0],q[1]-NUC[1],q[2]-NUC[2])>150)EUK.ribo.push(q);}
for(let i=0;i<6;i++){const a=rng()*6.28,b=Math.acos(2*rng()-1),r=120+rng()*90;const q=[r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)];if(Math.hypot(q[0]-NUC[0],q[1]-NUC[1],q[2]-NUC[2])>140)EUK.ves.push(q);}
for(let i=0;i<16;i++){const a=rng()*6.28,b=Math.acos(2*rng()-1),r=rng()*62;EUK.chrom.push([NUC[0]+r*Math.sin(b)*Math.cos(a),NUC[1]+r*Math.cos(b),NUC[2]+r*Math.sin(b)*Math.sin(a)]);}
function euk(cx,cy,s,a,hl){
  for(const q of EUK.memb)ball(q[0],q[1],q[2],11,[105,160,235],a*.5,cx,cy,s);
  for(const q of EUK.env)ball(q[0],q[1],q[2],6.5,[200,165,235],a*.8,cx,cy,s);
  ball(NUC[0]+14,NUC[1]+8,NUC[2]-20,31,[95,60,150],a,cx,cy,s);
  for(const q of EUK.chrom)ball(q[0],q[1],q[2],7,[215,160,240],a*.9,cx,cy,s);
  for(const ch of EUK.mito)for(const q of ch)ball(q[0],q[1],q[2],q[3],[245,150,60],a,cx,cy,s);
  for(const q of EUK.er)ball(q[0],q[1],q[2],7,[90,205,170],a,cx,cy,s);
  for(const arc of EUK.golgi)for(const q of arc)ball(q[0],q[1],q[2],9,[245,215,90],a,cx,cy,s);
  for(const q of EUK.ribo)ball(q[0],q[1],q[2],4.5,[235,120,160],a,cx,cy,s);
  for(const q of EUK.ves)ball(q[0],q[1],q[2],15,[130,200,250],a,cx,cy,s);
  if(hl>0)ball(NUC[0],NUC[1],NUC[2]-60,170,[255,235,130],a*.28*hl,cx,cy,s);
}
const eukAnchor={nuc:NUC,mito:EUK.mito[0][2],golgi:[EUK.golgi[1][4][0],EUK.golgi[1][4][1],EUK.golgi[1][4][2]]};

// ---------- نموذج الخلية بدائية النواة (عصوية) ----------
const PRO={wall:[],nucleoid:[],plasmid:[],ribo:[]};
for(let xi=-150;xi<=150;xi+=30)for(let k=0;k<16;k++){const a=k/16*6.2832;PRO.wall.push([xi,100*Math.cos(a),100*Math.sin(a)]);}
[-1,1].forEach(sg=>{fib(90,100).forEach(p=>{if(p[0]*sg>12)PRO.wall.push([p[0]+150*sg,p[1],p[2]]);});});
for(let k=0;k<170;k++){const u=k/170*6.2832;PRO.nucleoid.push([68*Math.sin(3*u)+40*Math.sin(5*u+1),44*Math.cos(2*u)+30*Math.sin(7*u),44*Math.sin(4*u+.5)+25*Math.cos(3*u)]);}
[[-102,38,22,0],[104,-42,-18,1]].forEach(c=>{for(let k=0;k<16;k++){const a=k/16*6.2832;PRO.plasmid.push([c[0],c[1]+22*Math.cos(a),c[2]+22*Math.sin(a)]);}});
for(let i=0;i<64;i++){const q=[(rng()*2-1)*205,(rng()*2-1)*78,(rng()*2-1)*78];if(Math.hypot(q[1],q[2])<80)PRO.ribo.push(q);}
function pro(cx,cy,s,a){
  for(const q of PRO.wall)ball(q[0],q[1],q[2],9.5,[110,200,140],a*.5,cx,cy,s);
  for(const q of PRO.nucleoid)ball(q[0],q[1],q[2],7.2,[250,115,165],a,cx,cy,s);
  for(const q of PRO.plasmid)ball(q[0],q[1],q[2],5.2,[255,225,120],a,cx,cy,s);
  for(const q of PRO.ribo)ball(q[0],q[1],q[2],4.6,[235,150,90],a,cx,cy,s);
}
// لافتة تشير لنقطة بالمجسّم
function project(pt,cx,cy,s){return P(pt[0],pt[1],pt[2],cx,cy,s);}
function callout(pt,cx,cy,s,label,sub,lx,ly,a,w,col){if(a<=0)return;const p=project(pt,cx,cy,s);col=col||'#fbbf24';
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lerp(lx,p.x,clamp(a*1.4)),lerp(ly,p.y,clamp(a*1.4)));ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  const th=txt(label,lx,ly,{size:27,maxW:w-30,alpha:0,weight:'700'});
  const lines=wrap(label,w-30,'700 27px '+FB,'rtl');const bh=lines.length*42+(sub?34:0)+22;
  ctx.save();ctx.globalAlpha=a*.95;ctx.fillStyle='rgba(2,14,20,.82)';rrect(lx-w/2,ly-bh/2,w,bh,18);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  txt(label,lx,ly-(sub?17:0),{size:27,maxW:w-30,alpha:a,weight:'700',color:'#fff'});
  if(sub)txt(sub,lx,ly+bh/2-30,{size:22,maxW:w-30,alpha:a,dir:'ltr',font:FL,weight:'500',color:col});}

// ================= المقطع 1: أنواع الخلية =================
const T1=50;
function R1(t){
  bg(t);yaw=t*.28+userYaw;pitch=-.25+userPitch;
  // 0-5.4 مقدمة: خلية حقيقية النواة صغيرة + عنوان
  const aI=fin(t,0,5.4,.7);
  if(aI>0){euk(360,790,.82,aI,0);flush();head('الخلية','Cell',aI);txt('الوحدة التركيبية لجميع الكائنات الحية',360,310,{size:36,alpha:aI,maxW:600,shadow:1});}
  // 5.4-9: نوعان
  const aN=fin(t,5.4,9.2,.6);
  if(aN>0){txt('تُقسَم الخلايا إلى نوعين',360,170,{size:50,font:FT,weight:'700',alpha:aN,shadow:1});txt('من حيث التركيب',360,240,{size:34,alpha:aN,color:'#5fcab9'});
    pro(190,700,.45,aN);euk(535,700,.56,aN,0);flush();
    ctx.save();ctx.globalAlpha=aN;[[535,'1','حقيقية النواة'],[190,'2','بدائية النواة']].forEach(([x,n,l])=>{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(x,880,28,0,7);ctx.fill();ctx.fillStyle='#04121a';ctx.font='700 32px '+FL;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(n==='1'?'٢':'١',x,882);});ctx.restore();
    txt('بدائية النواة',190,945,{size:34,alpha:aN,weight:'700'});txt('حقيقية النواة',535,945,{size:34,alpha:aN,weight:'700'});}
  // 9.2-25 بدائية النواة
  const aP=fin(t,9.2,25,.7);
  if(aP>0){head('الخلية بدائية النواة','Prokaryotic Cell',aP);pro(360,640,1.38,aP);flush();
    callout([0,0,0],360,640,1.38,'مادة وراثية حرّة، بلا غلاف نووي','',190,340,aP*fin(t,12.5,25,.5),330);
    callout([135,5,5],360,640,1.38,'لا توجد عضيات غشائية','Membranous Organelles',520,940,aP*fin(t,17.5,25,.5),330);
    subtitle('كما في الخلية البكتيرية: تفتقد الغلاف (الغشاء) النووي والعضيات الغشائية',aP*fin(t,10,25,.5));}
  // 25-41 حقيقية النواة
  const aE=fin(t,25,41,.7);
  if(aE>0){head('الخلية حقيقية النواة','Eukaryotic Cell',aE);euk(360,650,.95,aE,0);flush();
    callout(eukAnchor.nuc,360,650,.95,'نواة واضحة محاطة بغلاف نووي','',190,340,aE*fin(t,28.5,41,.5),330);
    callout(eukAnchor.mito,360,650,.95,'عضيات الخلية','Membranous Organelles',530,960,aE*fin(t,34,41,.5),330);
    subtitle('لها نواة واضحة محاطة بغلاف نووي وعضيات الخلية',aE*fin(t,26,41,.5));}
  // 41-50 مقارنة
  const aS=fin(t,41,T1+1,.7);
  if(aS>0){txt('المقارنة',360,130,{size:56,font:FT,weight:'700',alpha:aS,shadow:1});

function pinchEll(cx,cy,hw,hl,k,horiz){const N=60,pts=[];for(let i=0;i<=N;i++){const u=-1+2*i/N,w=hw*Math.sqrt(Math.max(0,1-u*u))*(1-.97*k*Math.exp(-Math.pow(u/.2,2)));pts.push([u*hl,w]);}
  ctx.beginPath();const P=(l,w)=>horiz?[cx+l,cy+w]:[cx+w,cy+l];let p=P(pts[0][0],pts[0][1]);ctx.moveTo(p[0],p[1]);for(const q of pts){p=P(q[0],q[1]);ctx.lineTo(p[0],p[1]);}for(let i=N;i>=0;i--){p=P(pts[i][0],-pts[i][1]);ctx.lineTo(p[0],p[1]);}ctx.closePath();}
function Xc(x,y,L,rot,c1,c2,w,tip){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineCap='round';ctx.lineWidth=w;ctx.strokeStyle=c1;ctx.beginPath();ctx.moveTo(-w*.9,-L/2);ctx.lineTo(w*.9,L/2);ctx.stroke();ctx.strokeStyle=c2;ctx.beginPath();ctx.moveTo(w*.9,-L/2);ctx.lineTo(-w*.9,L/2);ctx.stroke();if(tip){ctx.fillStyle=tip;ctx.beginPath();ctx.arc(w*.9,-L/2+2,w*.65,0,7);ctx.fill();ctx.beginPath();ctx.arc(-w*.9,L/2-2,w*.65,0,7);ctx.fill();}ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(0,0,w*.7,0,7);ctx.fill();ctx.restore();}
function Vc(x,y,L,dx,dy,col,w){ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=col;const ax=-dx*L/2,ay=-dy*L/2,px=-dy*w*1.3,py=dx*w*1.3;ctx.beginPath();ctx.moveTo(ax-px,ay-py);ctx.lineTo(0,0);ctx.lineTo(ax+px,ay+py);ctx.stroke();ctx.restore();}
function centro(x,y,sc,al){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#fde047';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(x+Math.cos(k*.785)*9*sc,y+Math.sin(k*.785)*9*sc);ctx.lineTo(x-Math.cos(k*.785)*9*sc,y-Math.sin(k*.785)*9*sc);}ctx.stroke();ctx.restore();}

const S3_110=SC([
 STEP('تكوين حبوب اللقاح','Pollen Formation',['النسيج الرابط الذي تفصل بين ردهتي الفص الواحد، وتصبح ردهة واحدة مفتوحة إلى الخارج عن طريق شق طولي خارجي (شكل 3-16) وبذلك تصبح حبوب اللقاح معدة للانتشار إلى الخارج','تحتوي أكياس اللقاح في البداية على الخلايا الأم للأبواغ الصغيرة والتي تكون ثنائية المجموعة الكروموسومية (2س)','وتمر الخلايا الأم للأبواغ الصغيرة (Microspores) بعملية انقسام اختزالي ينتج عنه أربعة أبواغ صغيرة والتي تكون أحادية المجموعة الكروموسومية (س) (شكل 3-17)','تنفصل الأبواغ الصغيرة الأربعة بعضها عن بعض وتتخذ شكلاً مميزاً حسب نوع النبات','تنقسم نواة البوغ الصغير انقساماً اعتيادياً وتحاط كل من النواتين الناتجتين بالسايتوبلازم مكونة خلية أنبوبية (Tube Cell) وخلية مولدة (Generative Cell) يطلق عليها في هذه المرحلة حبة اللقاح، وهي تمثل الطور المشيجي الذكري غير الناضج (شكل 3-17)','تنتشر حبوب اللقاح من المتك إلى الخارج بأعداد تقدر بالملايين من كل متك. وتكون حبة اللقاح محاطة بجدار سميك ذي أشواك أو أهداب أو يكون خشناً ويتخذ أشكالاً مختلفة حسب نوع النبات ويحوي عدداً من المناطق الرقيقة تدعى ثقوب الإنبات'],(L,a,i,u)=>{rotF(L,0);const k=[3.7,u*.95,1+u,1.95+.1*u,2+u,3+u][i];drawANTd(L,360,580,1.4,a,k);flush();

 cyc('دورة حياة نبات زهري','Fig 3-16',['شكل (3-16): دورة حياة نبات زهري وتتضح من خلاله مراحل تكوين حبوب اللقاح والبويضات (للاطلاع)','الطور البوغي (2س): متك ومبيض فيهما خلايا أم للأبواغ تنقسم اختزالياً فتتكون الأبواغ الصغيرة والكبيرة (س)','الطور المشيجي (س): حبة لقاح وكيس جنيني ← تلقيح وأنبوب لقاح ← إخصاب ← زيجة (2س) ← بذرة وثمرة ← نبات جديد'],nodes316,175,80,19,255,650,50)]);

 (()=>{const ph=CPx('تركيب المتك','Fig 3-17',null,['شكل (3-17): تركيب المتك في نبات زهري (للاطلاع)','(أ) متك غير ناضج: كيس اللقاح وفيه خلايا بوغية ← انقسام اختزالي ← الكيس البوغي الذكري (4 أبواغ)','(ب) متك ناضج: حبوب اللقاح ← نواة خلية مولدة ونواة خلية أنبوبية ← أمشاج (خليتان ذكريتان) ← تكوين أنبوب اللقاح'],40);

 STEP('المبيض والبويضات','Ovary & Ovules',['(2) المبيض وتكوين البويضات: تتألف المدقة بضمنها المبيض من ورقة كربلية ملتحمة واحدة أو أكثر وتمثل هذه الورقة أو الأوراق الكربلية أوراق الأبواغ الكبيرة (Megasporophylls)، في حين تمثل البويضات المرتبطة بجدار المبيض حوافظ الأبواغ الكبيرة (Megasporangia)','يبدأ نمو البويض بشكل نتوء صغير يدعى الجويزاء (Nucellus) متصل بجدار المبيض عن طريق الحبل السري، ويكون محاطاً بغلاف أو غلافين من خلايا حشوية تدعى الأغلفة، وتنمو هذه الأغلفة من قاعدة الجويزاء وتحيط به إحاطة تامة باستثناء منطقة القمة حيث تترك فتحة صغيرة جداً تدعى فتحة النقير (Micropyle)','تتولد داخل الجويزاء خلية معقدة تعرف بالخلية الأم للأبواغ الكبيرة (Megaspore Mother Cell)، وهي تمر بانقسام اختزالي لتكوين أربعة أبواغ كبيرة (Megaspores) أحادية المجموعة الكروموسومية (س) مرتبة في صف واحد','تضمحل ثلاثة أبواغ كبيرة ويبقى الرابع ليكون بوغاً فعالاً كبيراً، وهو يمثل الطور المشيجي الأنثوي غير الناضج وهو يسمى في حالة مغطاة البذور بالكيس الجنيني (Embryo Sac)، ويزداد في الحجم بزيادة الكتلة السايتوبلازمية والنواة، بحيث يحتل الجزء الأكبر من البويض'],(L,a,i,u)=>{rotF(L,-.2);if(i===0){drawM(MD.PIS,360,600-MD.PIS.mid*1.5,1.5,a);flush();txt('ورقة كربلية ← مبيض ← بويضات',360,330,{size:27,weight:'700',color:'#fde047',alpha:a,font:FT});}

const S3_112=SC([
 STEP('الكيس الجنيني','Embryo Sac',['تعاني نواة الكيس الجنيني ثلاثة انقسامات اعتيادية متتالية ينتج عنها ثماني نوى داخل الكيس الجنيني، تنتظم ثلاث نوى بالطرف القريب من النقير وثلاث في الطرف المقابل من الكيس الجنيني وتبقى اثنتان في المركز','تحاط نوى الطرف النقيري الثلاث بأغشية خلوية مكونة خلايا تمثل الوسطى منها خلية البيضة (Egg Cell) والنواتان الجانبيتان تصبحان خليتين مساعدتين (Synergid Cells)','أما نوى الطرف المقابل للطرف النقيري ضمن الكيس الجنيني فهي الأخرى تحاط بأغشية خلوية وتكون خلايا سمتية (Antipodals)، وتكون النواتان المركزيتان نواتين قطبيتين (Polar Nuclei)','ويمثل الكيس الجنيني في هذه الحالة الطور المشيجي الأنثوي الناضج (Mature Female Gametophyte) (شكل 3-16)','وبعد وصول الطور المشيجي الأنثوي مرحلة النضوج يصبح البويض الناضج مكوناً من الكيس الجنيني الناضج والجويزاء المحيطة به والأغلفة والحبل السري وهو في الغالب يبدو منحنياً إلى الأسفل بالشكل الذي يكون فيه النقير مجاوراً للحبل السري، وربما يتخذ أوضاعاً أخرى'],(L,a,i,u)=>{rotF(L,0);const k=[3+.99*u,4+.5*u,4.5+.5*u,5,5][i];drawOVD(L,360,540,1.45,a,k);flush();

 STEP('التلقيح','Pollination',['(3) التلقيح (Pollination): يعرف التلقيح بأنه عملية انتقال حبوب اللقاح من المتك إلى الميسم للنوع نفسه من النبات وتحصل نتيجة هذا الانتقال عملية الإخصاب (Fertilization)، وعليه فإن التلقيح يعد واحداً من العمليات المؤدية إلى تكوين البذور','وهناك نوعان من التلقيح هما: (1) التلقيح الذاتي (Self Pollination) (2) التلقيح الخلطي (Cross Pollination)','1. التلقيح الذاتي: يتم التلقيح الذاتي بانتقال حبوب اللقاح من متك زهرة إلى ميسم الزهرة نفسها أو إلى ميسم زهرة أخرى للنبات نفسه، ويحصل مثل هذا النوع من التلقيح في العديد من النباتات مثل الحنطة والشعير والرز والقطن والفاصوليا والبازلاء وأشجار الحمضيات وغيرها','2. التلقيح الخلطي: يتم هذا النوع من التلقيح بانتقال حبوب اللقاح من متك زهرة إلى ميسم زهرة أخرى لنبات آخر من النوع نفسه وربما إلى أنواع أخرى تنتمي إلى نفس الجنس. يحدث التلقيح الخلطي في العديد من النباتات وهو أكثر أهمية من التلقيح الذاتي حيث تكون الثمار والبذور الناتجة أكبر حجماً وأكثر عدداً وأسرع نمواً من تلك الناتجة من التلقيح الذاتي في الكثير من الأحيان'],(L,a,i,u)=>{rotF(L,-.1);const k=[0,0,.2+1.7*u,2+.95*u][i];drawPOLL(L,360,540,2.0,a,k);flush();
  txt(['انتقال حبوب اللقاح من المتك إلى الميسم','ذاتي أو خلطي','تلقيح ذاتي: الزهرة نفسها أو زهرة أخرى للنبات نفسه','تلقيح خلطي: نبات آخر من النوع نفسه'][i],360,330,{size:27,weight:'700',color:'#fde047',alpha:a,font:FT,maxW:660});})]);

const S3_113=SC([
 STEP('نواقل التلقيح','Pollinators',['لهذا ينصح المزارعون بإقامة خلايا النحل في البساتين أو قريباً منها لضمان حدوث التلقيح الخلطي للأزهار وبالتالي الحصول على ناتج وفير وذي نوعية جيدة','يعد النحل أكثر الحشرات تلقيحاً في النباتات حيث يقدر بعض الاقتصاديين عوائد تلقيح النحل بمبالغ هائلة (أكثر من مائتي مليار دولار) على مستوى العالم سنوياً. ولكن النحل ليس الوحيد الذي يؤدي وظيفة التلقيح في النباتات فهناك الكثير من الحشرات مثل الزنابير والخنافس والفراشات وغيرها، كما تقوم بعض العقربات أيضاً بعملية التلقيح كما هو الحال في بعض الطيور وغيرها','لابد من الإشارة إلى أن الرياح والمياه هي الأخرى تلعب دوراً في عملية انتقال حبوب اللقاح وبالتالي التلقيح، وقد يقوم الإنسان بذلك كما في النخيل'],(L,a,i,u)=>{rotF(L,-.1);if(i<2){drawPOLL(L,360,540,2.0,a,2+.99*((L*.18)%1));flush();if(i===1)txt('أكثر من 200 مليار دولار عائد التلقيح سنوياً',360,330,{size:24,weight:'700',color:'#fde047',alpha:a,font:FT,maxW:660});else txt('خلايا النحل = تلقيح خلطي = ناتج وفير',360,330,{size:26,weight:'700',color:'#fde047',alpha:a,font:FT,maxW:660});}
  else{const items=[['الرياح','💨'],['المياه','💧'],['الإنسان (النخيل)','🌴']];items.forEach((it,j)=>{const al=a*fin(L,j*2.2,60,.5);card(130+j*230,560,200,260,al,'#5fcab9');txt(it[1],130+j*230,520,{size:70,alpha:al});txt(it[0],130+j*230,640,{size:24,weight:'700',alpha:al,maxW:180,color:'#fde047'});});txt('تنقل حبوب اللقاح أيضاً',360,370,{size:28,weight:'700',color:'#fde047',alpha:a,font:FT});}}),
 STEP('أنبوب اللقاح','Pollen Tube',['(4) تكوين أنبوب اللقاح (Development of Pollen Tube): تنمو حبة اللقاح بعد سقوطها على الميسم فتكون أنبوباً ذا قطر ضيق يعرف بأنبوب اللقاح (Pollen Tube) وتنتج حبة اللقاح عادة أنبوباً لقاحياً واحداً','ينمو أنبوب اللقاح ويخترق الميسم والقلم حتى يصل إلى المبيض الذي يحوي البويضات، ولابد من الإشارة إلى أنه بالرغم من سقوط عدة حبوب لقاح على الميسم مكونة عدة أنابيب لقاح إلا أن واحداً فقط يدخل البويض الواحد','يستمر أنبوب اللقاح بالنمو وتخضع الخلية المولدة فيه إلى عملية انقسام اعتيادي واحد لتنتج خليتين ذكريتين (Sperm Cells)، وبهذا يحتوي أنبوب اللقاح على خلية أنبوبية وخليتين ذكريتين. ويمثل أنبوب اللقاح في هذه الحالة الطور المشيجي الذكري الناضج (شكل 3-16)، الذي يكون مهيئاً لعملية الإخصاب'],(L,a,i,u)=>{rotF(L,-.05);drawPTU(L,360,560,1.3,a,i===0?u*1.2:i===1?1+u*1.4:2.2+.8*u);flush();if(i===2){labL('خليتان ذكريتان',590,640,375,595,'#93c5fd',a,20);labL('خلية أنبوبية',130,690,345,610,'#c4b5fd',a,20);}}),
 STEP('الإخصاب المزدوج','Double Fertilization',['(5) الإخصاب وتكوين الجنين (Fertilization and Embryo Development): مع وصول أنبوب اللقاح إلى البويض فإنه يخترق فتحة النقير ويدخل إلى الجويزاء ثم إلى الكيس الجنيني ويفرغ محتوياته فيه، وعندها تتحد إحدى الخليتين الذكريتين مع خلية البيضة مكونة بيضة مخصبة أو زيجة (Zygote) والتي تكون ثنائية المجموعة الكروموسومية (2س) (شكل 3-16)','تتجه الخلية الذكرية الثانية نحو النواتين القطبيتين وتتحد نواتها مع هاتين النواتين مكونة نواة السويداء (Endosperm Nucleus)، وبهذا تصبح هذه النواة ثلاثية المجموعة الكروموسومية (3س) (شكل 3-16). يطلق على عمليتي الاتحاد المشار إليهما في أعلاه (اتحاد إحدى نواتي الخليتين الذكريتين بنواة البيضة واتحاد نواة الخلية الذكرية الثانية بالنواتين القطبيتين) بعملية الإخصاب المزدوج (Double Fertilization)، الذي يمثل أحد سمات ومميزات النباتات الزهرية','بعد اكتمال عملية الإخصاب تنحل الخلايا السمتية والخليتان المساعدتان والخلية الأنبوبية. وتبدأ البيضة المخصبة بالانقسام الاعتيادي والنمو والتمايز لتكوين الجنين'],(L,a,i,u)=>{rotF(L,0);drawOVD(L,360,540,1.45,a,5,i===0?u*1.0:i===1?1+1.1*u:2.1+.9*u);flush();

 if(k>=.1&&k<1.4){const t=smooth(clamp((k-.1)/1.2));for(let i=0;i<10;i++){const tt=clamp(t*1.3-i*.05);if(tt>0)m.push([lerp(tipM[0],vag[0],tt),lerp(tipM[1],vag[1],tt)-Math.sin(tt*3.14)*40,6,3.4,BLc,1]);}}

 if(k>=2&&k<3){const u=smooth(clamp(k-2)),R=seedR(8);for(let i=0;i<Math.round(u*14);i++)m.push([70+R()*50,150+R()*40,6,5.4,[245,235,200],1]);}

  ['(ب) المستوى الخلوي للتعضي: نعني بالتعضي الخلوي أن هناك مجموعة من الخلايا المتمايزة وظيفياً، ويتضح في هذه المرتبة من التعضي تقسيم في العمل إذ تختص بعض الخلايا بالتكاثر والبعض الآخر بالتغذية كما هو الحال في مستعمرة الفولفكس.',(L,a)=>{SHOW(L,a,mVOL,1.5,'(ب) المستوى الخلوي — مستعمرة الفولفكس',{pit:-.3});cdT('خلايا للتكاثر   |   خلايا للتغذية',360,880,640,90,a*fin(L,1.5,99,.4),'#4ade80',26);}],
  ['(ج) مستوى النسيج الخلوي للتعضي: في هذا المستوى من التعضي تتجمع الخلايا المتماثلة في طبقات محددة لتصبح نسيجاً، ويعتقد بعض العلماء أن الاسفنجيات تنتمي إلى هذه المرتبة على الرغم من أن قناديل البحر واللاسعات يشار إليها عادة إلى أنها تمثل بداية تكوين النسيج.',(L,a)=>{SHOW(L,a,mSPO,1.2,'(ج) مستوى النسيج الخلوي — الاسفنجيات',{pit:-.35});cdT('خلايا متماثلة ← طبقات ← نسيج (بداية)',360,900,640,90,a*fin(L,1.5,99,.4),'#fbbf24',26);}],
  ['(د) مستوى الأنسجة المتعضية: ويحصل فيه تجمع الأنسجة لتكوين الأعضاء، وتعتبر هذه المرتبة خطوة متقدمة في التعضي، وغالباً ما تتكون الأعضاء من أكثر من نوع من الأنسجة لتؤدي وظيفة أكثر تخصصاً منها من النسيج الواحد. يبدأ هذا المستوى من التعضي في الديدان المسطحة، حيث يوجد فيها عدد من الأعضاء المحددة مثل الخرطوم والأعضاء التناسلية حيث تنتظم الأخيرة في صورة جيدة مكونة أعضاء التكاثر.',(L,a)=>{SHOW(L,a,mPLA,1.4,'(د) مستوى الأنسجة المتعضية — الديدان المسطحة',{pit:-.45});cdT('أنسجة ← أعضاء: خرطوم + أعضاء تناسلية',360,900,640,90,a*fin(L,1.5,99,.4),'#f472b6',26);}]
 ],26)]);

const S4_145=SC([
 ST('علم الأجنة','Embryology & Morphogenesis',[
  ['وعلم الأجنة (Embryology) هو العلم الذي يبحث في دراسة مراحل التكوين الجنيني (Development) بضمنها النمو (Growth) والتمايز (Differentiation).',(L,a)=>{CHL(['علم الأجنة Embryology','النمو Growth','التمايز Differentiation'],a,L,420,'#5fcab9',30);txt('التكوين الجنيني (Development)',360,360,{size:32,weight:'700',color:'#fde047',alpha:a,font:FT});}],
  ['تتم خلال عملية التكوين الجنيني عملية التحول الشكلي (Morphogenesis) وهي تكوين الشكل المظهري للجنين، وتكون الخطوات الأساسية لهذه العملية متشابهة في أجنة جميع الفقريات.',(L,a)=>{SHOW(L,a,(L)=>{const m=mEMB(0,0);return m;},1.2,'التحول الشكلي (Morphogenesis): تكوين الشكل المظهري للجنين',{pit:-.2});}],
  ['ولابد من الإشارة إلى أن اهتمام علم الأجنة لا يقتصر على المرحلة الجنينية فقط والتي تمثل مرحلة قبل التحول الشكلي (Premetamorphosis) في البرمائيات، ومرحلة قبل الفقس في الطيور، ومرحلة قبل الولادة في الحيوانات الجنينية، بل يستمر إلى مراحل أخرى متعلقة بنمو الفرد طيلة مراحله العمرية.',(L,a)=>{CHL(['البرمائيات: قبل التحول الشكلي (Premetamorphosis)','الطيور: قبل الفقس','الثدييات: قبل الولادة'],a,L,430,'#60a5fa',24);txt('اهتمام علم الأجنة لا يقتصر على المرحلة الجنينية',360,360,{size:28,weight:'700',color:'#fde047',alpha:a,font:FT,maxW:640});}],
  ['فمثلاً بعد تكوين الأعضاء في جنين الضفدع وبعد الفقس فإن اليرقة (الدعموص Tadpole) لا تشبه الأبوين فتدخل في مرحلة التحول الشكلي (Metamorphosis) التي تتضمن تغيرات وتحولات جسمية سريعة يتحول بعدها الدعموص المذنب آكل النبات في الماء إلى ضفدع صغير آكل لحوم في اليابسة، وتحدث عملية التحول الشكلي في الحشرات أيضاً.',(L,a,u)=>{SHOW(L,a,(L)=>mEMB(0,u),1.3,'الدعموص (Tadpole) ← تحول شكلي (Metamorphosis) ← ضفدع',{pit:-.2});cdT('ماء + آكل نبات ← يابسة + آكل لحوم',360,900,640,90,a*fin(L,2,99,.4),'#4ade80',26);}],
  ['أما في الثدييات فإن الوليد يشبه الأبوين ومع الولادة تبدأ أول خطوة من خطوات استمرار الوليد في النمو حيث تستبدل عظام محل غضاريف ويستمر نمو هذه العظام لفترة زمنية معينة، كما تقوم بعض الأعضاء بوظائفها لفترة معينة من الزمن (كالمبايض والخصى في الانسان).',(L,a,u)=>{SHOW(L,a,(L)=>mEMB(2,u),1.3,'الثدييات: الوليد يشبه الأبوين ويستمر نموه',{pit:-.2});cdT('غضاريف ← عظام   |   مبايض وخصى تعمل لفترة معينة',360,900,640,90,a*fin(L,2,99,.4),'#f472b6',24);}]
 ],24),
 ST('نظريات التكوين','Theories of Embryology',[
  ['4-5-1 الآراء والنظريات عن التكوين الجنيني: لقد شغل موضوع التكوين الجنيني للفرد أذهان العلماء والباحثين منذ أمد ليس بالقريب، وكان اهتمامهم ينصب حول الإجابة عن تساؤل مفاده: ما هي الآلية التي تتحكم في تكوين كائن جديد شبيه بالأبوين؟ ولقد عجزوا عن تفسير الكثير من النقاط المهمة في تكوين وتشكيل الجنين «لأن الخلق هو سراً من أسرار الوجود». وفيما يأتي إيجازاً للأفكار والنظريات التي بحثت في التكوين الجنيني:',(L,a)=>{txt('؟',360,560,{size:240,weight:'700',color:'#f472b6',alpha:a,font:FT});cdT('ما الآلية التي تتحكم في تكوين كائن جديد شبيه بالأبوين؟',360,880,640,100,a,'#f472b6',26);}],
  ['1 وضع الفيلسوف الإغريقي أبقراط في القرن الخامس قبل الميلاد الملاحظات الوصفية الأولى حول التكوين الجنيني للدجاج، تبعه الفيلسوف اليوناني أرسطو (Aristotle 350 B.C) الذي يعد مؤسس علم الأجنة، فقد وصف التكوين الجنيني للدجاج ودونه، وذكر أن أجزاء الجنين تتشكل تباعاً من مواد البيضة وقد استند في وصفه هذا على العين المجردة وهو بذلك أسس علم الأجنة الوصفي (Descriptive Embryology).',(L,a)=>{SHOW(L,a,(L)=>{const m=[];zegg(m,0,0,0,70,{nuc:false});for(let i=0;i<14;i++)m.push([-10+i*2,-30+i*4,16,5,[250,150,150],.9]);return m;},1.6,'أبقراط ثم أرسطو (350 ق.م): علم الأجنة الوصفي',{pit:-.3});cdT('وصف تكوين الدجاج بالعين المجردة (Descriptive Embryology)',360,900,640,90,a*fin(L,2,99,.4),'#fbbf24',24);}],
  ['2 بعد اعتماد الطريقة العلمية في تحليل الظواهر الطبيعية والحياتية في القرنين السابع عشر والثامن عشر تطورت العلوم ومن ضمنها علم الأجنة، فبعد اكتشاف المجهر قدم العالم دي گراف (De Graaf) عام (1672م) وصفاً للحويصلات المبيضية ووصف العالم ليفنهوك (Leewaenhock) النطفة عام (1677م). فنبلورت مفاهيم عديدة كانت لها دور مهم في تقدم علم الأجنة.',(L,a)=>{SHOW(L,a,mSP,1.2,'اكتشاف المجهر: دي گراف 1672م — ليفنهوك 1677م',{pit:-.3});cdT('دي گراف: الحويصلات المبيضية',200,900,300,90,a*fin(L,1,99,.4),'#f472b6',22);cdT('ليفنهوك: النطفة',520,900,300,90,a*fin(L,2,99,.4),'#60a5fa',22);}]
 ],26)]);

const S4_146=SC([
 ST('قبل التشكيل والتراكمي','Preformation & Epigenesis',[
  ['3 نظرية قبل التشكيل (Preformation Theory): افترض بعض مؤيدي هذه النظرية وجود جنين مصغر داخل البيضة يدعى قزم جنيني (Homunculus) وإن أجزاءه تكبر عند التنبيه بالسائل المنوي، وقد تعزز موقف هؤلاء العلماء عندما اوضح العالم بونت (Bonnet) عام (1745م) قابلية بيوض بعض الحشرات مثل حشرة (المن) على النمو عذرياً من دون اخصاب أي بعملية التكوين العذري (Parthenogenesis).',(L,a)=>{SHOW(L,a,(L)=>mHOM(0),1.15,'نظرية قبل التشكيل: قزم جنيني (Homunculus) داخل البيضة',{pit:-.2,cy:720});cdT('بونت 1745م: حشرة المن تنمو عذرياً بلا إخصاب (Parthenogenesis)',360,960,660,90,a*fin(L,2,99,.4),'#fbbf24',23);}],
  ['في حين افترض القسم الآخر من مؤيدي نظرية قبل التشكيل أن القزم الجنيني يوجد في رأس النطفة حيث زعموا أنهم شاهدوا هذا القزم باستعمال مجهر ليفنهوك داخل رأس الحيوان المنوي (شكل 4-2).',(L,a)=>{SHOW(L,a,(L)=>{const m=mSP();ellP(m,-30,6,0,18,24,16,24,5,[240,200,170],.95);ellP(m,-30,32,0,12,18,10,12,5,[240,200,170],.95);return m;},1.7,'شكل 4-2: وجود القزم الجنيني داخل الحيوان المنوي (للاطلاع)',{pit:-.2,cy:700});}],
  ['بعدها اوضح العالم سبالانزاني (Spallanzani) أن تكوين الفرد الجديد يتطلب وجود امشاج ذكرية وامشاج أنثوية.',(L,a,u)=>{SHOW(L,a,(L)=>{const m=[];zegg(m,-60,0,0,56,{});ellP(m,60,-10,0,20,24,18,26,5,[222,214,238],.9);pipe(m,[[78,-10,0],[100,20,0],[84,60,0]],2.6,[222,214,238],.9);return m;},1.5,'سبالانزاني: فرد جديد = أمشاج ذكرية + أمشاج أنثوية',{pit:-.3});}],
  ['4 نظرية التكوين التراكمي (Epigenesis Theory): تفترض هذه النظرية أن الجنين ينكون من مادة حبيبية داخل البيضة تعاني تغيرات متحولة تدريجياً إلى جنين وتنسب هذه النظرية إلى العالم وولف (Wolff).',(L,a,u)=>{SHOW(L,a,(L)=>mCLV(L,{k:Math.min(5,Math.floor(u*5.9))}),1.3,'نظرية التكوين التراكمي (وولف): تغيرات تدريجية ← جنين',{pit:-.3});}]
 ],26)]);

const S4_147=SC([
 ST('فون بير والتجريبية','Von Baer & Experimental theories',[
  ['5 قانون فون بير (Von Baer Law): أشار العالم فون بير إلى أن الصفات العامة الأساسية لأجنة الحبليات تظهر قبل الصفات الخاصة المميزة لأفراد تلك المجموعة مثلاً ظهور الحبل الظهري في أجنة الحبليات قبل ظهور الصفات التي تميز الأنواع التي تنتمي إلى الحبليات مثل ظهور الريش في الطيور.',(L,a,u)=>{SHOW(L,a,(L)=>{const m=[];for(let k=0;k<3;k++){for(const q of mEMB(k,0)){m.push([q[0]+(k-1)*200,q[1],q[2],q[3]*.7,q[4],q[5]]);}}return m;},1.0,'أجنة الحبليات متشابهة في البداية (حبل ظهري)',{pit:-.2,cy:700});cdT('سمك   |   طير   |   إنسان',360,920,620,70,a*fin(L,1,99,.4),'#60a5fa',24);}],
  ['يعد العالم فون بير من العلماء الذين قدموا لعلم الأجنة الشيء الكثير فهو كان يقارن بين التكوين الجنيني في الحيوانات المختلفة في دراسات ضمن مايطلق عليه اليوم علم الأجنة المقارن (Comparative Embryology).',(L,a,u)=>{SHOW(L,a,(L)=>{const m=[];for(let k=0;k<3;k++)for(const q of mEMB(k,u))m.push([q[0]+(k-1)*200,q[1],q[2],q[3]*.7,q[4],q[5]]);return m;},1.0,'علم الأجنة المقارن (Comparative Embryology)',{pit:-.2,cy:700});cdT('تظهر الصفات الخاصة لاحقاً: ريش / زعانف / أطراف',360,920,640,80,a*fin(L,2,99,.4),'#4ade80',23);}],
  ['6 النظريات التجريبية (Experimental Theories): وهي النظريات التي تعتمد على إجراء التجربة في تفسير ظواهر التكوين الجنيني ويعتبر العالم روكس (Roux 1888) هو أول من قام بتجربة على بيضة الضفدع في مرحلة التفلج الأول وذلك بقتل أحد الفلجتين الناتجتين بإبرة ساخنة جداً.',(L,a,u)=>{SHOW(L,a,(L)=>mROUX(L,{u:Math.min(u*.5,.5)}),1.5,'روكس 1888: بيضة ضفدع في التفلج الأول',{pit:-.25});cdT('قتل إحدى الفلجتين بإبرة ساخنة',360,900,600,90,a*fin(L,1.5,99,.4),'#ef4444',26);}],
  ['فلاحظ أن الخلية المقتولة لها أثر على عملية التكوين الجنيني للخلية الأخرى لأن الجنين المتكون كان ناقص التكوين (غير كامل) عندما دخل علم الأجنة مرحلة علم الأجنة التجريبي (Experimental Embryology).',(L,a,u)=>{SHOW(L,a,(L)=>mROUX(L,{u:.5+u*.5}),1.5,'النتيجة: جنين ناقص التكوين (Experimental Embryology)',{pit:-.25});cdT('خلية حية ← نصف جنين   |   خلية مقتولة ← لا تنمو',360,900,640,90,a*fin(L,1.5,99,.4),'#fbbf24',24);}],
  ['وهذا مهد إلى اكتشاف ظاهرة التحريض الجنيني (Embryonic Induction) في الثلاثينات من القرن الماضي والتي تعني قابلية نسيج معين إلى التمايز بعد استلامه إشارات تحريضية تؤهله إلى التمايز مثل التمايز الحاصل في خلايا الاديم الظاهر بعد استلامها الإشارة المحرضة من النسيج الواقع تحتها وتحولها إلى صفيحة عصبية ينشأ منها الجهاز العصبي. وقد اكتشفت هذه الظاهرة من قبل العالمين سبيمان (Spemann) وهيلدا مانكولد (Helda Mangold) اللذان أجريا تجارب عديدة على أجنة الضفادع وحصل سبيمان على جائزة نوبل عام (1935م) نتيجة لتجاربه هذه.',(L,a,u)=>{SHOW(L,a,(L)=>mIND(L,{u:u}),1.15,'التحريض الجنيني (Embryonic Induction): سبيمان ومانكولد',{pit:-.55,cy:660});cdT('اديم ظاهر ← إشارة محرضة من النسيج تحته ← صفيحة عصبية',360,940,660,90,a*fin(L,2,99,.4),'#4ade80',23);}],

  ['ولابد من الإشارة إلى أنه في الوقت الحالي يمكن قبول نظرية التكوين المسبق على اعتبار أن جميع المعلومات الخاصة بتشكيل الجنين محددة سلفاً ومحمولة في الحامض النووي الرايبوزي منقوص الأوكسجين (DNA)، وكذلك قبول نظرية التكوين التراكمي على اعتبار أن أعضاء الجنين المختلفة تتكون بطريقة تراكمية وبالتدريج.',(L,a)=>{cdT('التكوين المسبق: المعلومات محددة سلفاً في DNA',360,520,640,110,a,'#5fcab9',26);cdT('التكوين التراكمي: الأعضاء تتكون تراكمياً وبالتدريج',360,680,640,110,a*fin(L,1.5,99,.4),'#fbbf24',26);txt('قبول النظريتين في الوقت الحالي',360,380,{size:32,weight:'700',color:'#fde047',alpha:a,font:FT});}]

{id:'B4-2',label:'مفهوم النمو والتمايز',page:142,total:S4_142.T+1,fn:S4_142},
{id:'B4-3',label:'مستويات التعضي',page:143,total:S4_143.T+1,fn:S4_143},

let cur=null;
function load(id){cur=PROBS.find(p=>p.id===id)||PROBS[0];userYaw=0;userPitch=0;return cur.total;}
function render(t){if(!cur)return;t=Math.max(0,Math.min(cur.total,t));ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);cur.fn(t);if(window.__ui)window.__ui(t);}
window.__load=load;window.__render=render;

// ================= واجهة الصفحة =================
const itemsBox=document.getElementById('items');const btns={};
PROBS.forEach(p=>{const b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=p.label+'<small>صفحة '+p.page+'</small>';b.addEventListener('click',()=>select(p.id,true));itemsBox.appendChild(b);btns[p.id]=b;});
const cover=document.getElementById('cover'),pb=document.getElementById('play'),pic=document.getElementById('pi'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('time'),screen=document.getElementById('screen');
let t=0,playing=false,last=0,TOTAL=1;const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
window.__ui=tt=>{fill.style.width=(tt/TOTAL*100)+'%';const ep=document.getElementById('eprogi');if(ep)ep.style.width=(tt/TOTAL*100)+'%';tm.textContent=fmt(tt)+' / '+fmt(TOTAL);bar.setAttribute('aria-valuenow',Math.round(tt));};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean')window.__edutokPaused=!d.playing;});
function select(id,go){TOTAL=load(id);bar.setAttribute('aria-valuemax',Math.round(TOTAL));Object.entries(btns).forEach(([k,b])=>b.classList.toggle('cur',k===id));t=0;if(go)play();else render(6);}
function setIcon(){pic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5l11 7-11 7z"/>';}
function play(){if(t>=TOTAL)t=0;playing=true;cover.hidden=true;last=performance.now();setIcon();requestAnimationFrame(loop);}
function pause(){playing=false;setIcon();}
function seek(v){t=Math.max(0,Math.min(TOTAL,v));cover.hidden=true;render(t);}
function loop(now){if(!playing)return;t+=Math.min(.05,(now-last)/1000);last=now;if(t>=TOTAL){if(EMBED){t=0;last=now;render(0);requestAnimationFrame(loop);return;}t=TOTAL;render(t);pause();return;}render(t);requestAnimationFrame(loop);}
pb.addEventListener('click',()=>playing?pause():play());cover.addEventListener('click',play);
let drag=null;
screen.addEventListener('pointerdown',e=>{if(cover.contains(e.target))return;drag={x:e.clientX,y:e.clientY,yaw:userYaw,pitch:userPitch,moved:false};screen.setPointerCapture(e.pointerId);});
screen.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;userYaw=drag.yaw-dx*.01;userPitch=Math.max(-.7,Math.min(.7,drag.pitch-dy*.006));if(!playing)render(t);});
screen.addEventListener('pointerup',()=>{if(drag&&!drag.moved){playing?pause():play();}drag=null;});
screen.addEventListener('pointercancel',()=>{drag=null;});
const seekX=x=>{const r=bar.getBoundingClientRect();seek((r.right-x)/r.width*TOTAL);};let bd=false;
bar.addEventListener('pointerdown',e=>{bd=true;bar.setPointerCapture(e.pointerId);seekX(e.clientX);});bar.addEventListener('pointermove',e=>{if(bd)seekX(e.clientX);});bar.addEventListener('pointerup',()=>bd=false);
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;if(e.key===' '){e.preventDefault();playing?pause():play();}else if(e.key==='ArrowLeft')seek(t+5);else if(e.key==='ArrowRight')seek(t-5);});
let first=PROBS[0].id;const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h))first=h;select(first,false);
window.addEventListener('hashchange',()=>{const hh=location.hash.slice(1);if(PROBS.some(p=>p.id===hh)){pause();select(hh,false);}});
// وضع التضمين: يبدأ تلقائياً، ويستقبل أوامر التشغيل/الإيقاف من التطبيق
if(EMBED){
  window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean'){d.playing?play():pause();}});
  const go=()=>{if(!playing&&!window.__edutokPaused)play();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(go,150));else setTimeout(go,400);
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!playing)render(t||6);});
})();
