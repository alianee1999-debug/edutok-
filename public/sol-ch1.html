<style>
/* Layout: a list of solved problems beside a phone-shaped 3D player (stacks on phones) */
:root{--bg:#ecefee;--panel:#ffffff;--fg:#141c1e;--muted:#5b686b;--line:#d2dbdc;--accent:#0e6b60;
  --f-title:"Amiri","Noto Naskh Arabic",serif;--f-body:"Noto Naskh Arabic",serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:var(--f-title);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.25}
.lede{margin:2px 0 0;color:var(--muted);line-height:1.8;max-width:64ch}
.list{display:flex;flex-direction:column;gap:14px;min-width:0}
.grp h2{font-family:var(--f-title);font-size:22px;margin:0 0 6px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:start}
.item small{display:block;color:var(--muted);font-size:12px}
.item.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item:focus-visible,.btn:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.player{position:static;order:-1}}
.screen{position:relative;background:#04121a;aspect-ratio:9/16;width:100%;max-width:100%}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;z-index:3}
.cover span{width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;background:rgba(0,0,0,.35)}
.cover svg{width:30px;height:30px;margin-left:5px}
.controls{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;height:36px;min-width:36px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted);direction:ltr}
.bar{flex:1 1 120px;min-width:0;height:26px;position:relative;cursor:pointer;touch-action:none}
.bar .track{position:absolute;inset:11px 0;background:var(--line);border-radius:4px}
.bar .fill{position:absolute;top:11px;bottom:11px;right:0;background:var(--accent);border-radius:4px}
.hint{color:var(--muted);font-size:13.5px;padding:0 12px 12px;margin:0}
.screen{touch-action:none}
.err{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;z-index:4;background:#04121a}
</style>

<style>
html.embed,html.embed body{margin:0;background:#05090c;height:100%;overflow:hidden}

html.embed .controls .btn{color:#e6ecea;border-color:#2a3a3e}
html.embed .bar .track{background:#2a3a3e}

<script>
// Solution scripts for chapter 1 (Thermodynamics) — computational examples, exercises and end-of-chapter questions.
// math markup: _{sub} ^{sup}
(function(){
const P=[];const add=o=>P.push(o);
const IRON='#7d848c',MG='#c9ccd1',AG='#c7ccd2',AU='#d8b13c';
const COL={C:'#4a4f55',H:'#f2f5f7',O:'#ff5a4a',N:'#5c8bff',S:'#f2d24d',Al:'#b8c2cc',Fe:'#a0522d',Cl:'#7bd66b',P:'#ff9f40',X:'#e8b64c'};
const qcFormula='q = c × m × ΔT';
const hessF=['ΔH_{r}^{°} = Σ n ΔH_{f}^{°}(products) − Σ n ΔH_{f}^{°}(reactants)'];
const sF=['ΔS_{r}^{°} = Σ n S^{°}(products) − Σ n S^{°}(reactants)'];
const gF=['ΔG = ΔH − TΔS'];

// ======================= الأمثلة =======================
add({id:'E1-1',label:'مثال 1-1',page:13,prop:'block',propOpt:{color:IRON,name:'حديد'},
 q:'ما مقدار الحرارة اللازمة لتسخين قطعة من الحديد كتلتها 870 g من 5 °C الى 95 °C ؟ علمًا أن الحرارة النوعية للحديد 0.45 J/g.°C',
 givens:[['m','870 g','الكتلة'],['T_{i}','5 °C','الابتدائية'],['T_{f}','95 °C','النهائية'],['c','0.45 J/g.°C','الحرارة النوعية']],find:'q = ? kJ',
 formula:qcFormula,
 steps:[{t:'نجد التغير في درجة الحرارة',m:['ΔT = T_{f} − T_{i}','ΔT = 95 − 5 = 90 °C']},
  {t:'نعوّض في القانون',m:['q = 0.45 × 870 × 90','q = 35235 J']},
  {t:'نحوّل من J إلى kJ بالقسمة على 1000',m:['q = 35235 ÷ 1000','q = 35.2 kJ']}],
 answer:['q = 35.2 kJ'],tip:'ΔT دائمًا = النهائية − الابتدائية، والوحدات تُختصر: J/g.°C × g × °C = J'});

add({id:'E1-2',label:'مثال 1-2',page:18,prop:'calorimeter',
 q:'باستخدام المسعر، وضعت 3 g من الكلوكوز C₆H₁₂O₆ (الكتلة المولية 180 g/mol) في وعاء العينة ثم ملئ بغاز الأوكسجين، ووضع الوعاء داخل وعاء معزول فيه 1200 g من الماء (c = 4.2 J/g.°C) وكانت درجة الحرارة 21.0 °C. بعد الاحتراق ارتفعت إلى 25.5 °C. احسب الحرارة المتحررة بوحدة kJ/mol نتيجة احتراق 1 mol من الكلوكوز، على فرض أن السعة الحرارية للمسعر مهملة.',
 givens:[['m_{glucose}','3 g'],['M','180 g/mol'],['m_{water}','1200 g'],['c','4.2 J/g.°C'],['T_{i} → T_{f}','21.0 → 25.5 °C']],find:'ΔH = ? kJ/mol',
 formula:['q = c × m × ΔT','n = m ÷ M'],formulaNote:'الحرارة التي امتصها الماء = الحرارة التي حررها التفاعل',
 steps:[{t:'التغير في درجة حرارة الماء',m:['ΔT = 25.5 − 21.0 = 4.5 °C']},
  {t:'الحرارة التي امتصها الماء',m:['q = 4.2 × 1200 × 4.5','q = 22680 J']},
  {t:'الحرارة متحررة من التفاعل فتكون سالبة',m:['q_{rxn} = −22680 J']},
  {t:'عدد مولات الكلوكوز',m:['n = 3 ÷ 180','n ≈ 0.017 mol']},
  {t:'الحرارة لكل مول، ثم نحوّل إلى kJ',m:['ΔH = −22680 ÷ 0.017','ΔH = −1334118 J/mol','ΔH ≈ −1334 kJ/mol']}],
 answer:['ΔH = −1334 kJ/mol'],answerNote:'الإشارة السالبة: الاحتراق باعث للحرارة',tip:'نستخدم كتلة الماء في q = c m ΔT، لا كتلة الكلوكوز'});

add({id:'E1-3',label:'مثال 1-3',page:24,prop:'reaction',propOpt:{left:[[COL.C,6],[COL.H,6]],right:[[COL.X,6]]},
 q:'اذا علمت أن انثالبي التكوين القياسية للبنزين C₆H₆ تساوي ΔH°f = 49 kJ/mol، اكتب المعادلة الكيميائية الحرارية للتفاعل بحيث تكون ΔH°r مساوية الى ΔH°f',
 givens:[['ΔH_{f}^{°}(C_{6}H_{6})','49 kJ/mol']],find:'المعادلة الحرارية',
 formula:['ΔH_{r}^{°} = ΔH_{f}^{°}'],formulaNote:'عندما يتكون مول واحد من المركب من عناصره بأثبت صورها',
 steps:[{t:'نكتب العناصر بأثبت صورها: الكربون غرافيت والهيدروجين غاز',m:['C_{(graphite)} ,  H_{2(g)}']},
  {t:'نوازن لتكوين مول واحد فقط من البنزين',m:['6C_{(graphite)} + 3H_{2(g)} → C_{6}H_{6(l)}']},
  {t:'نضيف قيمة الانثالبي',m:['ΔH_{r}^{°} = ΔH_{f}^{°} = 49 kJ/mol']}],
 answer:['6C_{(graphite)} + 3H_{2(g)} → C_{6}H_{6(l)}','ΔH_{r}^{°} = 49 kJ/mol'],tip:'شرطان: مول واحد من الناتج، والعناصر بأثبت صورها في الظروف القياسية'});

add({id:'E1-4',label:'مثال 1-4',page:24,prop:'reaction',propOpt:{left:[[COL.C,1],[COL.O,2]],right:[[COL.X,3]]},
 q:'أي من التفاعلات التالية تساوي قيمة انثالبي التفاعل القياسية ΔH°r لها الى قيمة انثالبي التكوين القياسية ΔH°f للمركبات المتكونة: (1) 4Fe + 3O₂ → 2Fe₂O₃ ، (2) C(graphite) + O₂ → CO₂ ، (3) CO + ½O₂ → CO₂',
 givens:[['(1)','4Fe + 3O_{2} → 2Fe_{2}O_{3}'],['(2)','C_{(graphite)} + O_{2} → CO_{2}'],['(3)','CO + ½O_{2} → CO_{2}']],find:'ΔH_{r}^{°} = ΔH_{f}^{°} ?',
 formula:['ΔH_{r}^{°} = ΔH_{f}^{°}'],formulaNote:'إذا تكوّن مول واحد من المركب من عناصره بأثبت صورها',
 steps:[{t:'التفاعل (1): الناتج 2 mol من Fe₂O₃',m:['2 mol ≠ 1 mol  ✗']},
  {t:'التفاعل (2): مول واحد من CO₂ من عناصره',m:['C + O_{2} → 1 mol CO_{2}  ✓']},
  {t:'التفاعل (3): المتفاعل CO مركب وليس عنصرًا',m:['CO مركب  ✗']}],
 answer:['التفاعل (2)'],tip:'المتفاعلات يجب أن تكون عناصر، والناتج مول واحد فقط'});

add({id:'E1-5',label:'مثال 1-5',page:26,prop:'reaction',propOpt:{left:[[COL.X,3],[COL.O,3]],right:[[COL.C,2],[COL.H,3]]},
 q:'اكتب المعادلة الكيميائية الحرارية لحرق الكحول الأثيلي السائل C₂H₅OH اذا علمت أن ΔH°c(C₂H₅OH) = −1367 kJ/mol',
 givens:[['ΔH_{c}^{°}(C_{2}H_{5}OH)','−1367 kJ/mol']],find:'معادلة الاحتراق',
 formula:['وقود + O_{2} → CO_{2} + H_{2}O'],formulaNote:'يحرق مول واحد من المادة مع كمية وافية من الأوكسجين',
 steps:[{t:'نكتب مول واحد من الكحول مع الأوكسجين، والنواتج CO₂ و H₂O',m:['C_{2}H_{5}OH_{(l)} + O_{2(g)} → CO_{2(g)} + H_{2}O_{(l)}']},
  {t:'نوازن: 2 كربون ← 2CO₂ ، 6 هيدروجين ← 3H₂O',m:['C_{2}H_{5}OH + 3O_{2} → 2CO_{2} + 3H_{2}O']},
  {t:'نضيف حرارة الاحتراق',m:['ΔH_{c}^{°} = −1367 kJ/mol']}],
 answer:['C_{2}H_{5}OH_{(l)} + 3O_{2(g)} → 2CO_{2(g)} + 3H_{2}O_{(l)}','ΔH_{c}^{°} = −1367 kJ/mol'],tip:'تحقق من الأوكسجين: 4 + 3 = 7 في النواتج، و 1 + 6 = 7 في المتفاعلات'});

add({id:'E1-6',label:'مثال 1-6',page:27,prop:'phase',propOpt:{kind:'vap',reverse:true,color:'#bfe3ff'},
 q:'اذا علمت أن انثالبي التبخر للأمونيا تساوي 23 kJ/mol، احسب انثالبي التكثيف للأمونيا.',
 givens:[['ΔH_{vap}','23 kJ/mol']],find:'ΔH_{cond} = ?',
 formula:['ΔH_{cond} = − ΔH_{vap}'],formulaNote:'التكثيف عكس التبخر، فنعكس الإشارة',
 steps:[{t:'معادلة التبخر',m:['NH_{3(l)} → NH_{3(g)}   ΔH_{vap} = 23 kJ/mol']},
  {t:'التكثيف عكس التبخر',m:['NH_{3(g)} → NH_{3(l)}','ΔH_{cond} = −23 kJ/mol']}],
 answer:['ΔH_{cond} = −23 kJ/mol'],answerNote:'التكثيف باعث للحرارة',tip:'عكس أي عملية يعكس إشارة ΔH مع بقاء القيمة نفسها'});

add({id:'E1-7',label:'مثال 1-7',page:29,prop:'hess',propOpt:{levels:[0,-1.4,1.2,-.4]},
 q:'احسب انثالبي التكوين القياسية للمركب CS₂(l) من عناصره الأساسية باثبت صورها: C(graphite) + 2S(rhombic) → CS₂(l)، اذا اعطيت: (1) C + O₂ → CO₂ ΔH = −394 kJ ، (2) S + O₂ → SO₂ ΔH = −296 kJ ، (3) CS₂ + 3O₂ → CO₂ + 2SO₂ ΔH = −1072 kJ',
 givens:[['(1)','C + O_{2} → CO_{2}   −394 kJ'],['(2)','S + O_{2} → SO_{2}   −296 kJ'],['(3)','CS_{2} + 3O_{2} → CO_{2} + 2SO_{2}   −1072 kJ']],find:'ΔH_{f}^{°}(CS_{2}) = ?',
 formula:['قانون هيس: ΔH الكلي = مجموع ΔH للخطوات'],formulaNote:'نرتب المعادلات حتى يكون مجموعها هو التفاعل المطلوب',
 steps:[{t:'CS₂ يجب أن يكون في النواتج، فنعكس المعادلة (3)',m:['CO_{2} + 2SO_{2} → CS_{2} + 3O_{2}','ΔH = +1072 kJ']},
  {t:'نحتاج 2S، فنضرب المعادلة (2) في 2',m:['2S + 2O_{2} → 2SO_{2}','ΔH = 2 × (−296) = −592 kJ']},
  {t:'نجمع (1) مع المعادلتين الجديدتين',m:['ΔH = −394 + 1072 + (−592)','ΔH_{f}^{°}(CS_{2}) = 86 kJ/mol']}],
 answer:['ΔH_{f}^{°}(CS_{2}) = +86 kJ/mol'],tip:'عند عكس معادلة نعكس الإشارة، وعند ضربها في عدد نضرب ΔH بنفس العدد'});

add({id:'E1-8',label:'مثال 1-8',page:31,prop:'bars',propOpt:{values:[[-822,'#ee8066'],[-1670,'#5fcab9']]},propLabels:[],
 q:'يجري التفاعل الذي يتضمن الألمنيوم وأوكسيد الحديد (III) كالآتي: 2Al + Fe₂O₃ → Al₂O₃ + 2Fe ، احسب انثالبي التفاعل القياسية اذا علمت أن ΔH°f(Al₂O₃) = −1670 kJ/mol و ΔH°f(Fe₂O₃) = −822 kJ/mol',
 givens:[['ΔH_{f}^{°}(Al_{2}O_{3})','−1670 kJ/mol'],['ΔH_{f}^{°}(Fe_{2}O_{3})','−822 kJ/mol'],['ΔH_{f}^{°}(Al, Fe)','0','عناصر']],find:'ΔH_{r}^{°} = ?',
 formula:hessF,
 steps:[{t:'نعوّض: العناصر بأثبت صورها قيمتها صفر',m:['ΔH = [ΔH_{f}(Al_{2}O_{3}) + 2(0)] − [2(0) + ΔH_{f}(Fe_{2}O_{3})]']},
  {t:'نحسب',m:['ΔH = [−1670] − [−822]','ΔH = −848 kJ']}],
 answer:['ΔH_{r}^{°} = −848 kJ'],answerNote:'تفاعل باعث للحرارة بشدة (تفاعل الثرميت)',tip:'ΔH_f لأي عنصر بأثبت صوره = صفر'});

add({id:'E1-10',label:'مثال 1-10',page:38,prop:'entropy',propOpt:{dir:-1,color:'#ffb36b'},
 q:'احسب التغير في انتروبي التفاعل القياسية ΔS°r للتفاعل التالي عند الظروف القياسية 25 °C وضغط 1 atm: 2CO + O₂ → 2CO₂ اذا علمت أن S°(CO) = 198 ، S°(CO₂) = 214 ، S°(O₂) = 205 J/K.mol',
 givens:[['S^{°}(CO)','198 J/K.mol'],['S^{°}(CO_{2})','214 J/K.mol'],['S^{°}(O_{2})','205 J/K.mol']],find:'ΔS_{r}^{°} = ?',
 formula:sF,
 steps:[{t:'نعوّض حسب المعاملات',m:['ΔS = [2 S^{°}(CO_{2})] − [2 S^{°}(CO) + S^{°}(O_{2})]','ΔS = [2 × 214] − [2 × 198 + 205]']},
  {t:'نحسب',m:['ΔS = 428 − 601','ΔS = −173 J/K.mol']}],
 answer:['ΔS_{r}^{°} = −173 J/K.mol'],answerNote:'3 مولات غاز أصبحت 2، فقلّت العشوائية',tip:'S° للعناصر ليست صفرًا، بعكس ΔH_f'});

add({id:'E1-11',label:'مثال 1-11',page:40,prop:'gibbs',propOpt:{tilt:-.3},
 q:'احسب طاقة كبس الحرة القياسية للتفاعل التالي عند الظروف القياسية 25 °C وضغط 1 atm، وبين هل التفاعل يجري تلقائيًا أم لا: 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O ، اذا علمت أن ΔG°f(C₆H₆) = 173 ، ΔG°f(CO₂) = −394 ، ΔG°f(H₂O) = −237 kJ/mol',
 givens:[['ΔG_{f}^{°}(C_{6}H_{6})','173 kJ/mol'],['ΔG_{f}^{°}(CO_{2})','−394 kJ/mol'],['ΔG_{f}^{°}(H_{2}O)','−237 kJ/mol'],['ΔG_{f}^{°}(O_{2})','0']],find:'ΔG_{r}^{°} = ?',
 formula:['ΔG_{r}^{°} = Σ n ΔG_{f}^{°}(products) − Σ n ΔG_{f}^{°}(reactants)'],
 steps:[{t:'النواتج',m:['12(−394) + 6(−237) = −4728 − 1422 = −6150 kJ']},
  {t:'المتفاعلات',m:['2(173) + 15(0) = 346 kJ']},
  {t:'نطرح',m:['ΔG = −6150 − 346','ΔG = −6496 kJ']}],

const bookNum=s=>s.replace(/(\d+)-(\d+)/,(m,a,b)=>'\u2066'+b+'-'+a+'\u2069');
const ISO=s=>s.replace(/[A-Za-z0-9°ₐΔ(½−][A-Za-z0-9°ₐ\/.,:×÷+\-−=%₀₁₂₃₄₅₆₇₈₉⁻ ΔΣ()→½]*[A-Za-z0-9°ₐ%₀₁₂₃₄₅₆₇₈₉)]|[A-Za-z0-9]/g,m=>'⁦'+m+'⁩');
function txt(s,x,y,font,color,align='center',alpha=1,shadow=true){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='rtl';

const RUN=/[A-Za-z0-9°ₐΔ(½−][A-Za-z0-9°ₐ\/.,:×÷+\-−=%₀₁₂₃₄₅₆₇₈₉⁻ ΔΣ()→½]*[A-Za-z0-9°ₐ%₀₁₂₃₄₅₆₇₈₉)]/g;
function wrap(s,font,maxw){ctx.save();ctx.font=font;ctx.direction='rtl';
  // keep each Latin/number run together so equations are not split across lines
  const glued=s.replace(RUN,m=>m.replace(/ /g,'\u00A0'));let words=[];
  glued.split(' ').forEach(w=>{if(ctx.measureText(ISO(w.replace(/\u00A0/g,' '))).width<=maxw){words.push(w);return;}let cur='';w.split('\u00A0').forEach(p=>{const tr=cur?cur+'\u00A0'+p:p;if(ctx.measureText(ISO(tr.replace(/\u00A0/g,' '))).width>maxw&&cur){words.push(cur);cur=p;}else cur=tr;});if(cur)words.push(cur);});
  const lines=[];let cur='';words.forEach(w=>{const tr=cur?cur+' '+w:w;if(ctx.measureText(ISO(tr.replace(/\u00A0/g,' '))).width>maxw&&cur){lines.push(cur);cur=w;}else cur=tr;});if(cur)lines.push(cur);ctx.restore();return lines.map(l=>l.replace(/\u00A0/g,' '));}

function build(P){const sc=[];const qlen=P.q.length;

  if(P.givens&&P.givens.length)sc.push({type:'givens',d:3+P.givens.length*1.6+(P.find?2:0),say:P.givensSay||'المعطيات في السؤال، وما المطلوب'});
  if(P.formula)sc.push({type:'formula',d:6+(Array.isArray(P.formula)?(P.formula.length-1)*2.2:0),say:P.formulaSay||'القانون الذي نحتاجه'});
  P.steps.forEach((st,i)=>sc.push({type:'step',idx:i,d:2.6+st.m.length*3.1+(st.note?2:0),say:st.t}));
  sc.push({type:'answer',d:7+(P.answer.length-1)*1.8,say:P.answerSay||'الجواب النهائي'});
  if(P.tip)sc.push({type:'tip',d:6.5,say:P.tip});
  let t=0;sc.forEach(s=>{s.s=t;t+=s.d;});return {scenes:sc,total:t+1.2};}

  ctx.save();ctx.fillStyle='rgba(6,18,24,.75)';ctx.beginPath();ctx.roundRect(36,36,170,58,14);ctx.fill();ctx.restore();txt('صفحة '+cur.page,121,66,'600 28px '+FB,WH,'center',1,false);

  if(S.type==='q'){dim(.45);const lines=wrap(cur.q,'600 33px '+FB,580);const h=lines.length*54+130;const y0=Math.max(150,560-h/2);glass(40,y0,W-80,h,a,'rgba(250,246,232,.95)');
    txt('نص السؤال',W-80,y0+44,'700 30px '+FT,'#9a6a10','right',a,false);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#d9c79a';ctx.fillRect(80,y0+72,W-160,2);ctx.restore();
    const reveal=clamp((lt-.5)/Math.max(1,S.d*.45));lines.forEach((l,k)=>txt(l,W-80,y0+112+k*54,'600 33px '+FB,'#1d2b33','right',a*clamp(reveal*lines.length-k+.5),false));}
  else if(S.type==='givens'){txt('المعطيات',W-60,150,'700 44px '+FT,GOLD,'right',a);
    cur.givens.forEach((g,k)=>{const ap=clamp((lt-.6-k*1.4)/.4)*a;const y=230+k*86;glass(60,y-36,W-120,72,ap);math(g[0]+' = '+g[1],W/2-(g[2]?40:0),y,38,WH,ap,'center',g[2]?470:580);if(g[2])txt(g[2],W-80,y,'500 20px '+FB,SOFT,'right',ap,false);});
    if(cur.find){const k=cur.givens.length;const y=230+k*86+20;const ap=clamp((lt-.8-k*1.4)/.4)*a;glass(60,y-36,W-120,72,ap,'rgba(232,182,76,.22)');txt('المطلوب:',W-84,y,'700 28px '+FB,GOLD,'right',ap,false);math(cur.find,W/2-60,y,36,WH,ap,'center',440);}}
  else if(S.type==='formula'){dim(.4);txt('القانون',W/2,230,'700 46px '+FT,GOLD,'center',a);const fs=Array.isArray(cur.formula)?cur.formula:[cur.formula];const h=fs.length*90+60;glass(40,300,W-80,h,a);
    fs.forEach((f,k)=>math(f,W/2,360+k*90,46,WH,a*clamp((lt-.5-k*1.6)/.5)));if(cur.formulaNote)txt(cur.formulaNote,W/2,300+h+50,'500 26px '+FB,SOFT,'center',a*clamp((lt-2)/.6));}
  else if(S.type==='step'){const st=cur.steps[S.idx];txt('الخطوة '+(S.idx+1),W-60,150,'700 30px '+FB,GOLD,'right',a);const tl=wrap(st.t,'700 36px '+FB,600);tl.forEach((l,k)=>txt(l,W-60,205+k*50,'700 36px '+FB,WH,'right',a));
    const y0=230+tl.length*50;glass(40,y0,W-80,st.m.length*88+40,a);
    st.m.forEach((m,k)=>{const ap=clamp((lt-.8-k*3.1)/.6)*a;math(m,W/2,y0+64+k*88,42,k===st.m.length-1&&st.hl!==false?'#ffe3a3':WH,ap);});
    if(st.note)txt(st.note,W/2,y0+st.m.length*88+90,'500 26px '+FB,SOFT,'center',a*clamp((lt-1-st.m.length*3.1)/.6));}
  else if(S.type==='answer'){txt('الجواب',W/2,180,'700 50px '+FT,GOLD,'center',a);const h=cur.answer.length*96+60;glass(50,240,W-100,h,a,'rgba(232,182,76,.18)');
    cur.answer.forEach((m,k)=>math(m,W/2,300+k*96,52,'#ffe3a3',a*clamp((lt-.5-k*1.2)/.5)));
    if(cur.answerNote)txt(cur.answerNote,W/2,240+h+50,'600 28px '+FB,WH,'center',a*clamp((lt-2)/.6));}
  else if(S.type==='tip'){dim(.35);glass(50,330,W-100,260,a,'rgba(238,128,102,.22)');txt('انتبه!',W/2,385,'700 46px '+FT,'#ffb19c','center',a,false);
    wrap(cur.tip,'600 32px '+FB,560).forEach((l,k)=>txt(l,W/2,450+k*48,'600 32px '+FB,WH,'center',a,false));}
  // 3D labels from the prop
  if(prop.label&&(S.type==='givens'||S.type==='step')&&prop.anchors.label){const p=proj(prop.anchors.label);txt(prop.label,p.x,p.y,'700 28px '+FB,WH,'center',a*.9);}
  const PL=cur.propLabels||(cur.prop==='gibbs'?[['L','ΔH','#ffb19c'],['R','TΔS','#9ff3e4']]:cur.prop==='reaction'?[['left','المتفاعلات'],['right','النواتج']]:null);
  if(PL&&(S.type==='step'||S.type==='answer'||S.type==='givens'))PL.forEach(l=>{if(!prop.anchors[l[0]])return;const p=proj(prop.anchors[l[0]]);math(l[1],p.x,p.y,30,l[2]||WH,a*.95);});
  if(cur.prop==='bars'&&(S.type==='step'||S.type==='answer')&&cur.barLabels){cur.barLabels.forEach((l,k)=>{const b=prop.bars||[];});}
  /* subtitles removed */
  const fadeIn=clamp(lt/.35),fadeOut=i===TL.scenes.length-1?1:clamp((S.d-lt)/.25);const f=1-Math.min(fadeIn,fadeOut);if(f>0){ctx.fillStyle='rgba(0,0,0,'+f*.85+')';ctx.fillRect(0,0,W,H);}
  if(t<.8){ctx.fillStyle='rgba(0,0,0,'+(1-t/.8)+')';ctx.fillRect(0,0,W,H);}if(t>TL.total-1){ctx.fillStyle='rgba(0,0,0,'+clamp(t-(TL.total-1))+')';ctx.fillRect(0,0,W,H);}
  if(window.__ui)window.__ui(t);}
window.__load=load;window.__render=render;
const comp=document.createElement('canvas');comp.width=720;comp.height=1280;const cctx=comp.getContext('2d');
window.__frame=(t,q)=>{render(t);cctx.drawImage(glc,0,0,720,1280);cctx.drawImage(ov,0,0);return comp.toDataURL('image/jpeg',q||.9);};window.__sched=()=>TL.scenes.map(s=>({type:s.type,s:s.s,d:s.d}));window.__ids=()=>PROBS.map(p=>p.id);

// ================= page UI =================
const list=document.getElementById('list');const groups=[['مثال','الأمثلة المحلولة'],['تمرين','التمارين'],['سؤال','أسئلة نهاية الفصل']];const btns={};
groups.forEach(([k,title])=>{const g=document.createElement('section');g.className='grp';g.innerHTML='<h2>'+title+'</h2><div class="items"></div>';const box=g.querySelector('.items');
  PROBS.filter(p=>p.label.startsWith(k)).forEach(p=>{const b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=p.label.replace(/(\d+)-(\d+)/,(m,a,c)=>'<bdi dir="ltr">'+c+'-'+a+'</bdi>')+'<small>صفحة '+p.page+'</small>';b.addEventListener('click',()=>select(p.id,true));box.appendChild(b);btns[p.id]=b;});list.appendChild(g);});
const cover=document.getElementById('cover'),pb=document.getElementById('play'),pic=document.getElementById('pi'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('time');
let t=0,playing=false,last=0,TOTAL=1;const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
window.__ui=t=>{fill.style.width=(t/TOTAL*100)+'%';tm.textContent=fmt(t)+' / '+fmt(TOTAL);bar.setAttribute('aria-valuenow',Math.round(t));};
function select(id,go){userYaw=0;userPitch=0;TOTAL=load(id);bar.setAttribute('aria-valuemax',Math.round(TOTAL));Object.entries(btns).forEach(([k,b])=>b.classList.toggle('cur',k===id));t=0;if(go){play();}else render(3);
  try{localStorage.setItem('ch1-last',id);}catch(e){}}
function setIcon(){pic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5l11 7-11 7z"/>';}
function play(){if(t>=TOTAL)t=0;playing=true;cover.hidden=true;last=performance.now();setIcon();requestAnimationFrame(loop);}
function pause(){playing=false;setIcon();}
function seek(v){t=Math.max(0,Math.min(TOTAL,v));cover.hidden=true;render(t);}
function loop(now){if(!playing)return;t+=Math.min(.05,(now-last)/1000);last=now;if(t>=TOTAL){t=TOTAL;render(t);pause();return;}render(t);requestAnimationFrame(loop);}
pb.addEventListener('click',()=>playing?pause():play());cover.addEventListener('click',play);
const screen=document.getElementById('screen');let drag=null;screen.addEventListener('pointerdown',e=>{if(cover.contains(e.target))return;drag={x:e.clientX,y:e.clientY,yaw:userYaw,pitch:userPitch,moved:false};screen.setPointerCapture(e.pointerId);});
screen.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;userYaw=drag.yaw-dx*.008;userPitch=Math.max(-.35,Math.min(.3,drag.pitch-dy*.005));if(!playing)render(t);});
screen.addEventListener('pointerup',()=>{if(drag&&!drag.moved){playing?pause():play();}drag=null;});
const seekX=x=>{const r=bar.getBoundingClientRect();seek((r.right-x)/r.width*TOTAL);};let bd=false;
bar.addEventListener('pointerdown',e=>{bd=true;bar.setPointerCapture(e.pointerId);seekX(e.clientX);});bar.addEventListener('pointermove',e=>{if(bd)seekX(e.clientX);});bar.addEventListener('pointerup',()=>bd=false);
let first=PROBS[0]&&PROBS[0].id;try{const l=localStorage.getItem('ch1-last');if(l&&PROBS.some(p=>p.id===l))first=l;}catch(e){}
const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h))first=h;
if(first)select(first,false);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h)){pause();select(h,false);}});
if(document.documentElement.classList.contains('embed')){try{const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6){if(!playing)play();}else if(playing)pause();});},{threshold:[0,.6,1]});io.observe(document.getElementById('screen'));}catch(e){setTimeout(play,600);}}
window.addEventListener('message',e=>{const d=e.data;if(d==='play'||(d&&d.type==='play'))play();else if(d==='pause'||(d&&d.type==='pause'))pause();});

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Promise.all(['700 40px Amiri','600 20px "Noto Naskh Arabic"','20px "STIX Two Text"','500 20px "IBM Plex Mono"'].map(f=>document.fonts.load(f).catch(()=>{})))).then(()=>{if(!playing)render(3);});
})();
