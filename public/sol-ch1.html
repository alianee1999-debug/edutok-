<style>
/* Layout: a list of solved problems beside a phone-shaped 3D player (stacks on phones) */
:root{--bg:#ecefee;--panel:#ffffff;--fg:#141c1e;--muted:#5b686b;--line:#d2dbdc;--accent:#0e6b60;
  --f-title:"Amiri","Noto Naskh Arabic",serif;--f-body:"Noto Naskh Arabic",serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:var(--f-title);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.25}
.lede{margin:2px 0 0;color:var(--muted);line-height:1.8;max-width:64ch}
.list{display:flex;flex-direction:column;gap:14px;min-width:0}
.grp h2{font-family:var(--f-title);font-size:22px;margin:0 0 6px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:start}
.item small{display:block;color:var(--muted);font-size:12px}
.item.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item:focus-visible,.btn:focus-visible,.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.player{position:static;order:-1}}
.screen{position:relative;background:#04121a;aspect-ratio:9/16;width:100%;max-width:100%}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center;z-index:3}
.cover span{width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;background:rgba(0,0,0,.35)}
.cover svg{width:30px;height:30px;margin-left:5px}
.controls{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;height:36px;min-width:36px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px}
.btn svg{width:18px;height:18px;fill:currentColor}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted);direction:ltr}
.bar{flex:1 1 120px;min-width:0;height:26px;position:relative;cursor:pointer;touch-action:none}
.bar .track{position:absolute;inset:11px 0;background:var(--line);border-radius:4px}
.bar .fill{position:absolute;top:11px;bottom:11px;right:0;background:var(--accent);border-radius:4px}
/* وضع التضمين داخل تطبيق EduTok: بدون عنوان ولا قائمة ولا أزرار، المشهد فقط (التحكم من التطبيق) */
html.embed,html.embed body{background:#04121a;margin:0;padding:0;overflow:hidden;height:100%}

html.embed header,html.embed .list,html.embed .controls,html.embed .cover{display:none!important}
html.embed .player{border:0;border-radius:0;position:static;background:#04121a;height:100vh;height:100dvh}
html.embed .screen{aspect-ratio:auto;height:100%;width:100%}
html.embed .screen canvas{object-fit:contain}
.eprog{display:none}
html.embed .eprog{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:5}

.err{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;z-index:4;background:#04121a}

<div class="wrap" dir="rtl">
  <header>
    <h1>حلول الفصل الأول: الثرموداينمك</h1>
    <p class="lede">كل مثال وتمرين وسؤال حسابي من الفصل في مقطع ثلاثي الأبعاد يبدأ بنص السؤال ورقم صفحته، ثم المعطيات والقانون والحل خطوة بخطوة. اختر مسألة من القائمة.</p>
  </header>
  <div class="list" id="list"></div>
  <div class="player">

      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ov" width="720" height="1280" aria-label="حل المسألة"></canvas>

      <button class="cover" id="cover" aria-label="تشغيل"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span></button>
    </div>

      <span class="time" id="time">0:00</span>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED)document.documentElement.classList.add('embed');
const W=720,H=1280;
const glc=document.getElementById('gl'),ov=document.getElementById('ov'),ctx=ov.getContext('2d');
const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,u)=>a+(b-a)*u,ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const fin=(lt,a,b,f=.5)=>Math.min(clamp((lt-a)/f),1-clamp((lt-b+f)/f));
let seed=7;const rng=()=>(seed=(seed*16807)%2147483647)/2147483647;
const FT='"Amiri","Noto Naskh Arabic",serif',FB='"Noto Naskh Arabic","Amiri",serif',FM='"IBM Plex Mono",monospace',FX='"STIX Two Text","Times New Roman",serif';
const GOLD='#e8b64c',WH='#ffffff',SOFT='#cfe0e0';
if(!window.THREE){document.getElementById('screen').insertAdjacentHTML('beforeend','<div class="err">تعذّر تحميل محرك الرسم ثلاثي الأبعاد. أعد فتح الصفحة.</div>');return;}
const PROBS=window.PROBLEMS||[];

// ================= 3D world =================
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:!window.__FAST,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(window.__GLW||720,window.__GLH||1280,false);
const scene=new THREE.Scene();scene.background=new THREE.Color('#04121a');scene.fog=new THREE.Fog('#04121a',14,34);
const cam=new THREE.PerspectiveCamera(40,9/16,.1,200);
scene.add(new THREE.HemisphereLight('#a6e4ff','#08161b',.6));
const key=new THREE.DirectionalLight('#ffffff',.9);key.position.set(5,10,7);scene.add(key);
const rimA=new THREE.PointLight('#ffb35c',.8,18);rimA.position.set(4,4,-3);scene.add(rimA);
const rimB=new THREE.PointLight('#5cc8ff',.8,18);rimB.position.set(-4,3,-2);scene.add(rimB);
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,48),new THREE.MeshStandardMaterial({color:'#0b232b',roughness:.4,metalness:.3}));floor.rotation.x=-Math.PI/2;scene.add(floor);
for(let i=1;i<6;i++){const r=new THREE.Mesh(new THREE.RingGeometry(i*2.2,i*2.2+.02,64),new THREE.MeshBasicMaterial({color:'#2a5560',transparent:true,opacity:.35}));r.rotation.x=-Math.PI/2;r.position.y=.005;scene.add(r);}
const pg=new THREE.BufferGeometry();const pp=new Float32Array(500*3);for(let i=0;i<500;i++){pp[i*3]=(rng()-.5)*24;pp[i*3+1]=rng()*12;pp[i*3+2]=(rng()-.5)*24;}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:'#cdefff',size:.05,transparent:true,opacity:.5,depthWrite:false}));scene.add(dust);

const glassMat=new THREE.MeshStandardMaterial({color:'#d8f0f5',transparent:true,opacity:.16,roughness:.05,metalness:.2,side:THREE.DoubleSide,depthWrite:false});
const rimMat=new THREE.MeshStandardMaterial({color:'#e9f7fa',transparent:true,opacity:.7,roughness:.1});
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.3,metalness:.1},o));
const liquid=(c,op=.85)=>new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:op,roughness:.15,emissive:c,emissiveIntensity:.15});
function cyl(r,h,m,open){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,40,1,!!open),m);}
function arrow(col){const g=new THREE.Group();const s=cyl(.06,1,std(col,{emissive:col,emissiveIntensity:.4}));s.geometry.translate(0,.5,0);const h=new THREE.Mesh(new THREE.ConeGeometry(.16,.35,20),std(col,{emissive:col,emissiveIntensity:.4}));g.add(s,h);g.userData={s,h};return g;}
function setArrow(a,from,to,p){const d=to.clone().sub(from);const L=d.length()*p;if(L<.01){a.visible=false;return;}a.visible=true;a.position.copy(from);a.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());a.userData.s.scale.set(1,Math.max(.01,L-.3),1);a.userData.h.position.y=Math.max(.01,L-.3)+.17;}

// ---------- prop library: each returns {g, update(state)}; state={sc,type,step,steps,p,t,P} ----------
const PROPS={
 block(o){const g=new THREE.Group();const m=std(o.color||'#8a9198',{metalness:.85,roughness:.3,emissive:'#ff5a1a',emissiveIntensity:0});
   const b=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.1,1.1),m);b.position.y=.55+.15;g.add(b);
   const st=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.6,.15,40),std('#33424a',{metalness:.6}));st.position.y=.075;g.add(st);
   const th=thermometer();th.g.position.set(1.5,0,.2);g.add(th.g);
   return {g,label:o.name,update(s){const heat=o.cool?1-s.prog:s.prog;m.emissiveIntensity=(o.cool?.5:0)+.6*(o.cool?-s.prog*.5:heat);th.set(o.cool?1-s.prog*.7:.2+.75*s.prog);b.rotation.y=Math.sin(s.t*.4)*.2;},anchors:{label:[0,1.6,0]}};},
 calorimeter(o){const g=new THREE.Group();const outer=cyl(1.25,2.2,std('#e8eef0',{roughness:.6,transparent:true,opacity:.5,side:THREE.DoubleSide}),true);outer.position.y=1.1;g.add(outer);
   const water=cyl(1.15,1.6,liquid('#4fb3e8',.55));water.position.y=.85;g.add(water);
   const inner=cyl(.45,1.4,std('#9aa6ad',{metalness:.8,roughness:.25}));inner.position.y=1;g.add(inner);
   const lid=cyl(1.3,.12,std('#cfd8dc'));lid.position.y=2.25;g.add(lid);
   const th=thermometer();th.g.position.set(.75,1.2,0);th.g.scale.setScalar(.9);g.add(th.g);
   const glow=new THREE.PointLight('#ffb35c',0,4);glow.position.set(0,1,0);g.add(glow);
   return {g,label:o.name||'المسعر',update(s){th.set(.25+.7*s.prog);glow.intensity=s.type==='step'?1.2*Math.abs(Math.sin(s.t*3)):0;g.rotation.y=s.t*.15;},anchors:{label:[0,2.7,0]}};},
 beaker(o){const g=new THREE.Group();const tube=cyl(1,2.4,glassMat,true);tube.position.y=1.25;g.add(tube);const lq=cyl(.94,1,liquid(o.color||'#cfd8dc',.9));lq.geometry.translate(0,.5,0);lq.position.y=.06;lq.scale.y=1.4;g.add(lq);
   const lip=new THREE.Mesh(new THREE.TorusGeometry(1,.04,8,48),rimMat);lip.rotation.x=Math.PI/2;lip.position.y=2.45;g.add(lip);
   const th=thermometer();th.g.position.set(.35,.4,0);g.add(th.g);
   return {g,label:o.name,update(s){th.set(o.cool?1-s.prog*.7:.2+.75*s.prog);g.rotation.y=s.t*.12;},anchors:{label:[0,3,0]}};},
 reaction(o){const g=new THREE.Group();const L=new THREE.Group(),R=new THREE.Group();L.position.set(-1.45,1.3,0);R.position.set(1.45,1.3,0);g.add(L,R);
   const fill=(grp,list)=>{const tot=list.reduce((a,c)=>a+c[1],0);let k=0;list.forEach(c=>{for(let i=0;i<c[1];i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),std(c[0],{emissive:c[0],emissiveIntensity:.15}));
     const a=k/tot*Math.PI*2,r=tot>1?.42:0;s.position.set(Math.cos(a)*r,Math.sin(a)*r,Math.sin(a*2)*.18);grp.add(s);k++;}});};
   fill(L,o.left||[['#555',3]]);fill(R,o.right||[['#e8b64c',3]]);
   const ar=arrow('#e8b64c');g.add(ar);
   return {g,update(s){L.rotation.y=s.t*.6;R.rotation.y=-s.t*.5;const p=s.type==='givens'||s.type==='q'?.4:1;setArrow(ar,new THREE.Vector3(-.65,1.3,0),new THREE.Vector3(.65,1.3,0),p);R.scale.setScalar(lerp(.5,1,s.prog));},anchors:{left:[-1.45,2.2,0],right:[1.45,2.2,0]}};},
 hess(o){const g=new THREE.Group();const lv=o.levels||[0,-1.5,1];const plats=lv.map((y,i)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,1.4),std(['#5fcab9','#f2b54d','#ee8066','#9fb4ff'][i%4],{transparent:true,opacity:.85}));p.position.set((i%2?1:-1)*.7,2.2+y*.75,0);g.add(p);return p;});
   const arrs=lv.slice(1).map(()=>{const a=arrow('#ffffff');g.add(a);return a;});
   return {g,update(s){const n=s.type==='step'?s.step+1:(s.type==='answer'?lv.length:1);plats.forEach((p,i)=>{p.visible=i<Math.max(1,n+ (s.type==='answer'?0:0))||s.type==='answer';p.scale.x=lerp(.2,1,clamp(s.local*2));});
     arrs.forEach((a,i)=>{const on=s.type==='answer'||(s.type==='step'&&i<=s.step);setArrow(a,plats[i].position.clone().add(new THREE.Vector3(0,.1,0)),plats[i+1].position.clone(),on?(s.type==='step'&&i===s.step?clamp(s.local*1.5):1):0);});g.rotation.y=Math.sin(s.t*.3)*.25;},anchors:{}};},
 bars(o){const g=new THREE.Group();const vals=o.values||[[-500,'#f2b54d'],[-300,'#5fcab9']];const mx=Math.max(...vals.map(v=>Math.abs(v[0])));
   const base=new THREE.Mesh(new THREE.BoxGeometry(vals.length*1.2+.6,.06,1.4),std('#cfe0e0',{transparent:true,opacity:.5}));base.position.y=2.2;g.add(base);
   const bs=vals.map((v,i)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.8),std(v[1],{emissive:v[1],emissiveIntensity:.25}));b.position.x=(i-(vals.length-1)/2)*1.2;g.add(b);return b;});
   return {g,update(s){bs.forEach((b,i)=>{const v=vals[i][0];const h=Math.max(.02,Math.abs(v)/mx*1.9*clamp(s.prog*1.3));b.scale.y=h;b.position.y=v<0?2.2-h/2:2.2+h/2;});g.rotation.y=Math.sin(s.t*.25)*.3;},anchors:{}, bars:bs,vals};},
 entropy(o){const g=new THREE.Group();const n=48;const ms=[];const mat=std(o.color||'#6fc3ff',{emissive:o.color||'#6fc3ff',emissiveIntensity:.3});
   for(let i=0;i<n;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat);g.add(s);ms.push({s,ord:[((i%4)-1.5)*.36,.5+Math.floor(i/16)*.36,(Math.floor(i/4)%4-1.5)*.36],dis:[(rng()-.5)*3.4,.3+rng()*2.6,(rng()-.5)*2.2],ph:rng()*6});}
   const box=new THREE.Mesh(new THREE.BoxGeometry(3.8,3.2,2.6),glassMat);box.position.y=1.65;g.add(box);
   return {g,update(s){const dir=o.dir||-1;let u=dir<0?1-s.prog:s.prog;ms.forEach(m=>{const j=Math.sin(s.t*3+m.ph)*.05*(.3+u);m.s.position.set(lerp(m.ord[0],m.dis[0],u)+j,lerp(m.ord[1],m.dis[1],u)+j,lerp(m.ord[2],m.dis[2],u));});g.rotation.y=s.t*.15;},anchors:{}};},
 gibbs(o){const g=new THREE.Group();const post=new THREE.Mesh(new THREE.ConeGeometry(.45,1.2,4),std('#9aa6ad',{metalness:.6}));post.position.y=.6;g.add(post);
   const beam=new THREE.Group();beam.position.y=1.25;g.add(beam);const bm=new THREE.Mesh(new THREE.BoxGeometry(4.2,.12,.5),std('#cfd8dc',{metalness:.5}));beam.add(bm);
   const L=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),std('#ee8066',{emissive:'#ee8066',emissiveIntensity:.25}));L.position.set(-1.6,.52,0);beam.add(L);
   const R=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),std('#5fcab9',{emissive:'#5fcab9',emissiveIntensity:.25}));R.position.set(1.6,.52,0);beam.add(R);
   return {g,update(s){const tilt=(o.tilt||-.25)*clamp(s.prog*1.5);beam.rotation.z=tilt;const sa=o.sizes||[1,1];L.scale.setScalar(lerp(1,sa[0],clamp(s.prog)));R.scale.setScalar(lerp(1,sa[1],clamp(s.prog)));g.rotation.y=Math.sin(s.t*.3)*.3;},anchors:{L:[-1.6,2.3,0],R:[1.6,2.3,0]},beam,L,R};},
 phase(o){const g=new THREE.Group();const ice=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),std('#bfe8ff',{transparent:true,opacity:.75,roughness:.05}));ice.position.y=.8;g.add(ice);
   const pool=cyl(1.3,.2,liquid(o.color||'#4fb3e8',.75));pool.position.y=.1;g.add(pool);
   const vap=[];for(let i=0;i<40;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),std('#e9f7fa',{transparent:true,opacity:.8}));g.add(s);vap.push({s,x:(rng()-.5)*2.4,z:(rng()-.5)*1.6,ph:rng(),sp:.5+rng()});}
   return {g,update(s){const k=o.kind||'vap';const u=o.reverse?1-s.prog:s.prog;
     if(k==='fus'){ice.visible=true;ice.scale.setScalar(Math.max(.05,1-u));pool.scale.set(1,lerp(.3,2,u),1);vap.forEach(v=>v.s.visible=false);}
     else{ice.visible=false;pool.scale.set(lerp(1,.3,u),lerp(2,.5,u),lerp(1,.3,u));vap.forEach(v=>{v.s.visible=true;const y=((s.t*v.sp+v.ph)%1)*3.2*u+.3;v.s.position.set(v.x*u,y,v.z*u);});}
     g.rotation.y=s.t*.2;},anchors:{}};},
};
function thermometer(){const g=new THREE.Group();const tube=cyl(.09,2.2,std('#ffffff',{transparent:true,opacity:.35}));tube.position.y=1.3;g.add(tube);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),std('#ff4b3a',{emissive:'#ff4b3a',emissiveIntensity:.4}));bulb.position.y=.2;g.add(bulb);
  const col=cyl(.05,1,std('#ff4b3a',{emissive:'#ff4b3a',emissiveIntensity:.4}));col.geometry.translate(0,.5,0);col.position.y=.25;g.add(col);return {g,set(v){col.scale.y=Math.max(.02,2.1*clamp(v));}};}

let prop=null,cur=null;
function look(px,py,pz,tx,ty,tz,orbit){const tgt=new THREE.Vector3(tx,ty,tz);const off=new THREE.Vector3(px-tx,py-ty,pz-tz);off.applyAxisAngle(new THREE.Vector3(0,1,0),orbit||0);cam.position.copy(tgt).add(off);cam.lookAt(tgt);cam.updateMatrixWorld(true);}
function proj(v){const p=new THREE.Vector3(v[0],v[1],v[2]);prop.g.localToWorld(p);p.project(cam);return {x:(p.x+1)/2*W,y:(1-p.y)/2*H};}

// ================= overlay text =================
const bookNum=s=>s.replace(/(\d+)-(\d+)/,(m,a,b)=>'\u2066'+b+'-'+a+'\u2069');
const ISO=s=>s.replace(/[A-Za-z0-9°ₐΔ(½−][A-Za-z0-9°ₐ\/.,:×÷+\-−=%₀₁₂₃₄₅₆₇₈₉⁻ ΔΣ()→½]*[A-Za-z0-9°ₐ%₀₁₂₃₄₅₆₇₈₉)]|[A-Za-z0-9]/g,m=>'⁦'+m+'⁩');
function txt(s,x,y,font,color,align='center',alpha=1,shadow=true){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='rtl';
  if(shadow){ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=12;}ctx.fillText(ISO(s),x,y);ctx.restore();}
const RUN=/[A-Za-z0-9°ₐΔ(½−][A-Za-z0-9°ₐ\/.,:×÷+\-−=%₀₁₂₃₄₅₆₇₈₉⁻ ΔΣ()→½]*[A-Za-z0-9°ₐ%₀₁₂₃₄₅₆₇₈₉)]/g;
function wrap(s,font,maxw){ctx.save();ctx.font=font;ctx.direction='rtl';
  // keep each Latin/number run together so equations are not split across lines
  const glued=s.replace(RUN,m=>m.replace(/ /g,'\u00A0'));let words=[];
  glued.split(' ').forEach(w=>{if(ctx.measureText(ISO(w.replace(/\u00A0/g,' '))).width<=maxw){words.push(w);return;}let cur='';w.split('\u00A0').forEach(p=>{const tr=cur?cur+'\u00A0'+p:p;if(ctx.measureText(ISO(tr.replace(/\u00A0/g,' '))).width>maxw&&cur){words.push(cur);cur=p;}else cur=tr;});if(cur)words.push(cur);});
  const lines=[];let cur='';words.forEach(w=>{const tr=cur?cur+' '+w:w;if(ctx.measureText(ISO(tr.replace(/\u00A0/g,' '))).width>maxw&&cur){lines.push(cur);cur=w;}else cur=tr;});if(cur)lines.push(cur);ctx.restore();return lines.map(l=>l.replace(/\u00A0/g,' '));}
// math mini-markup: _{sub} ^{sup}
function parseM(s){const out=[];let i=0;while(i<s.length){if((s[i]==='_'||s[i]==='^')&&s[i+1]==='{'){const j=s.indexOf('}',i);out.push([s.slice(i+2,j),s[i]==='_'?'sub':'sup']);i=j+1;}else{let j=i;while(j<s.length&&!((s[j]==='_'||s[j]==='^')&&s[j+1]==='{'))j++;out.push([s.slice(i,j),'n']);i=j;}}return out;}
function mathW(s,size){const parts=parseM(s);let w=0;ctx.save();parts.forEach(p=>{ctx.font=(p[1]==='n'?size:size*.62)+'px '+FX;w+=ctx.measureText(p[0]).width;});ctx.restore();return w;}
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function demark(s){return s.replace(/_\{([^}]*)\}/g,(m,a)=>/^[0-9]+$/.test(a)?a.split('').map(c=>SUB[c]).join(''):a).replace(/\^\{([^}]*)\}/g,(m,a)=>a);}
function math(s,x,y,size,col,alpha=1,align='center',maxw=640){if(alpha<=0)return;
  if(/[\u0600-\u06FF]/.test(s)){const str=demark(s);let sz=size*.8;ctx.save();ctx.font='600 '+sz+'px '+FB;ctx.direction='rtl';let w=ctx.measureText(ISO(str)).width;ctx.restore();if(w>maxw)sz*=maxw/w;
    txt(str,x,y,'600 '+sz+'px '+FB,col,align==='center'?'center':align,alpha);return;}let sz=size;let w=mathW(s,sz);if(w>maxw){sz=size*maxw/w;w=maxw;}
  ctx.save();ctx.globalAlpha=alpha;ctx.direction='ltr';ctx.textBaseline='alphabetic';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillStyle=col;
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;parseM(s).forEach(p=>{const ss=p[1]==='n'?sz:sz*.62;ctx.font=ss+'px '+FX;const dy=p[1]==='sup'?-sz*.4:p[1]==='sub'?sz*.2:0;ctx.fillText(p[0],cx,y+sz*.32+dy);cx+=ctx.measureText(p[0]).width;});ctx.restore();}
function glass(x,y,w,h,alpha,fill='rgba(6,18,24,.72)'){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(x,y,w,h,16);ctx.fill();ctx.stroke();ctx.restore();}
function dim(a){if(a>0){ctx.fillStyle='rgba(2,8,12,'+a+')';ctx.fillRect(0,0,W,H);}}
function subDraw(s,a){if(a<=0||!s)return;const lines=wrap(s,'600 31px '+FB,600);const base=1150-(lines.length-1)*46;ctx.save();ctx.globalAlpha=a*.55;ctx.fillStyle='#000';ctx.beginPath();ctx.roundRect(28,base-38,W-56,lines.length*46+28,16);ctx.fill();ctx.restore();
  lines.forEach((l,k)=>txt(l,W/2,base+k*46,'600 31px '+FB,'#ffffff','center',a));}

// ================= timeline =================
function build(P){const sc=[];const qlen=P.q.length;
  sc.push({type:'q',d:Math.min(20,Math.max(9,4+qlen*.055)),say:'اقرأ السؤال جيدًا… ثم لنستخرج المعطيات'});
  if(P.givens&&P.givens.length)sc.push({type:'givens',d:3+P.givens.length*1.6+(P.find?2:0),say:P.givensSay||'المعطيات في السؤال، وما المطلوب'});
  if(P.formula)sc.push({type:'formula',d:6+(Array.isArray(P.formula)?(P.formula.length-1)*2.2:0),say:P.formulaSay||'القانون الذي نحتاجه'});
  P.steps.forEach((st,i)=>sc.push({type:'step',idx:i,d:2.6+st.m.length*3.1+(st.note?2:0),say:st.t}));
  sc.push({type:'answer',d:7+(P.answer.length-1)*1.8,say:P.answerSay||'الجواب النهائي'});
  if(P.tip)sc.push({type:'tip',d:6.5,say:P.tip});
  let t=0;sc.forEach(s=>{s.s=t;t+=s.d;});return {scenes:sc,total:t+1.2};}
let TL=null;
function load(id){cur=PROBS.find(p=>p.id===id)||PROBS[0];if(prop)scene.remove(prop.g);prop=PROPS[cur.prop](cur.propOpt||{});prop.g.scale.setScalar(.82);scene.add(prop.g);TL=build(cur);seed=7;return TL.total;}

// ================= frame =================
function render(t){if(!cur)return;t=Math.max(0,Math.min(TL.total,t));let i=TL.scenes.findIndex(s=>t>=s.s&&t<s.s+s.d);if(i<0)i=TL.scenes.length-1;const S=TL.scenes[i],lt=t-S.s;const local=clamp(lt/S.d);
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  dust.rotation.y=t*.02;
  // overall progress drives the prop animation
  const nSteps=cur.steps.length;let prog=0;if(S.type==='step')prog=(S.idx+local)/nSteps;else if(S.type==='answer'||S.type==='tip')prog=1;else if(S.type==='givens')prog=.05;
  prop.update({type:S.type,step:S.idx||0,steps:nSteps,prog,local,t});
  const orbit=Math.sin(t*.12)*.35;
  if(S.type==='q'||S.type==='formula')look(0,3.4,10.5,0,3.2,0,orbit);else if(S.type==='answer'||S.type==='tip')look(0,3.4,10,0,2.9,0,orbit);else look(0,3.1,9.8,0,2.75,0,orbit);
  renderer.render(scene,cam);
  const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // header: problem label + page
  ctx.save();ctx.fillStyle='rgba(6,18,24,.75)';ctx.beginPath();ctx.roundRect(W-260,36,224,58,14);ctx.fill();ctx.restore();txt(bookNum(cur.label),W-148,66,'700 32px '+FT,GOLD,'center',1,false);
  ctx.save();ctx.fillStyle='rgba(6,18,24,.75)';ctx.beginPath();ctx.roundRect(36,36,170,58,14);ctx.fill();ctx.restore();txt('صفحة '+cur.page,121,66,'600 28px '+FB,WH,'center',1,false);
  const a=fin(lt,0,S.d,.45);
  if(S.type==='q'){dim(.45);const lines=wrap(cur.q,'600 33px '+FB,580);const h=lines.length*54+130;const y0=Math.max(150,560-h/2);glass(40,y0,W-80,h,a,'rgba(250,246,232,.95)');
    txt('نص السؤال',W-80,y0+44,'700 30px '+FT,'#9a6a10','right',a,false);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#d9c79a';ctx.fillRect(80,y0+72,W-160,2);ctx.restore();
    const reveal=clamp((lt-.5)/Math.max(1,S.d*.45));lines.forEach((l,k)=>txt(l,W-80,y0+112+k*54,'600 33px '+FB,'#1d2b33','right',a*clamp(reveal*lines.length-k+.5),false));}
  else if(S.type==='givens'){txt('المعطيات',W-60,150,'700 44px '+FT,GOLD,'right',a);
    cur.givens.forEach((g,k)=>{const ap=clamp((lt-.6-k*1.4)/.4)*a;const y=230+k*86;glass(60,y-36,W-120,72,ap);math(g[0]+' = '+g[1],W/2-(g[2]?40:0),y,38,WH,ap,'center',g[2]?470:580);if(g[2])txt(g[2],W-80,y,'500 20px '+FB,SOFT,'right',ap,false);});
    if(cur.find){const k=cur.givens.length;const y=230+k*86+20;const ap=clamp((lt-.8-k*1.4)/.4)*a;glass(60,y-36,W-120,72,ap,'rgba(232,182,76,.22)');txt('المطلوب:',W-84,y,'700 28px '+FB,GOLD,'right',ap,false);math(cur.find,W/2-60,y,36,WH,ap,'center',440);}}
  else if(S.type==='formula'){dim(.4);txt('القانون',W/2,230,'700 46px '+FT,GOLD,'center',a);const fs=Array.isArray(cur.formula)?cur.formula:[cur.formula];const h=fs.length*90+60;glass(40,300,W-80,h,a);
    fs.forEach((f,k)=>math(f,W/2,360+k*90,46,WH,a*clamp((lt-.5-k*1.6)/.5)));if(cur.formulaNote)txt(cur.formulaNote,W/2,300+h+50,'500 26px '+FB,SOFT,'center',a*clamp((lt-2)/.6));}
  else if(S.type==='step'){const st=cur.steps[S.idx];txt('الخطوة '+(S.idx+1),W-60,150,'700 30px '+FB,GOLD,'right',a);const tl=wrap(st.t,'700 36px '+FB,600);tl.forEach((l,k)=>txt(l,W-60,205+k*50,'700 36px '+FB,WH,'right',a));
    const y0=230+tl.length*50;glass(40,y0,W-80,st.m.length*88+40,a);
    st.m.forEach((m,k)=>{const ap=clamp((lt-.8-k*3.1)/.6)*a;math(m,W/2,y0+64+k*88,42,k===st.m.length-1&&st.hl!==false?'#ffe3a3':WH,ap);});
    if(st.note)txt(st.note,W/2,y0+st.m.length*88+90,'500 26px '+FB,SOFT,'center',a*clamp((lt-1-st.m.length*3.1)/.6));}
  else if(S.type==='answer'){txt('الجواب',W/2,180,'700 50px '+FT,GOLD,'center',a);const h=cur.answer.length*96+60;glass(50,240,W-100,h,a,'rgba(232,182,76,.18)');
    cur.answer.forEach((m,k)=>math(m,W/2,300+k*96,52,'#ffe3a3',a*clamp((lt-.5-k*1.2)/.5)));
    if(cur.answerNote)txt(cur.answerNote,W/2,240+h+50,'600 28px '+FB,WH,'center',a*clamp((lt-2)/.6));}
  else if(S.type==='tip'){dim(.35);glass(50,330,W-100,260,a,'rgba(238,128,102,.22)');txt('انتبه!',W/2,385,'700 46px '+FT,'#ffb19c','center',a,false);
    wrap(cur.tip,'600 32px '+FB,560).forEach((l,k)=>txt(l,W/2,450+k*48,'600 32px '+FB,WH,'center',a,false));}
  // 3D labels from the prop
  if(prop.label&&(S.type==='givens'||S.type==='step')&&prop.anchors.label){const p=proj(prop.anchors.label);txt(prop.label,p.x,p.y,'700 28px '+FB,WH,'center',a*.9);}
  const PL=cur.propLabels||(cur.prop==='gibbs'?[['L','ΔH','#ffb19c'],['R','TΔS','#9ff3e4']]:cur.prop==='reaction'?[['left','المتفاعلات'],['right','النواتج']]:null);
  if(PL&&(S.type==='step'||S.type==='answer'||S.type==='givens'))PL.forEach(l=>{if(!prop.anchors[l[0]])return;const p=proj(prop.anchors[l[0]]);math(l[1],p.x,p.y,30,l[2]||WH,a*.95);});
  if(cur.prop==='bars'&&(S.type==='step'||S.type==='answer')&&cur.barLabels){cur.barLabels.forEach((l,k)=>{const b=prop.bars||[];});}
  subDraw(S.say,Math.min(clamp(lt/.35),clamp((S.d-lt)/.35)));
  const fadeIn=clamp(lt/.35),fadeOut=i===TL.scenes.length-1?1:clamp((S.d-lt)/.25);const f=1-Math.min(fadeIn,fadeOut);if(f>0){ctx.fillStyle='rgba(0,0,0,'+f*.85+')';ctx.fillRect(0,0,W,H);}
  if(t<.8){ctx.fillStyle='rgba(0,0,0,'+(1-t/.8)+')';ctx.fillRect(0,0,W,H);}if(t>TL.total-1){ctx.fillStyle='rgba(0,0,0,'+clamp(t-(TL.total-1))+')';ctx.fillRect(0,0,W,H);}
  if(window.__ui)window.__ui(t);}
window.__load=load;window.__render=render;
const comp=document.createElement('canvas');comp.width=720;comp.height=1280;const cctx=comp.getContext('2d');
window.__frame=(t,q)=>{render(t);cctx.drawImage(glc,0,0,720,1280);cctx.drawImage(ov,0,0);return comp.toDataURL('image/jpeg',q||.9);};window.__sched=()=>TL.scenes.map(s=>({type:s.type,s:s.s,d:s.d}));window.__ids=()=>PROBS.map(p=>p.id);

// ================= page UI =================
const list=document.getElementById('list');const groups=[['مثال','الأمثلة المحلولة'],['تمرين','التمارين'],['سؤال','أسئلة نهاية الفصل']];const btns={};
groups.forEach(([k,title])=>{const g=document.createElement('section');g.className='grp';g.innerHTML='<h2>'+title+'</h2><div class="items"></div>';const box=g.querySelector('.items');
  PROBS.filter(p=>p.label.startsWith(k)).forEach(p=>{const b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=p.label.replace(/(\d+)-(\d+)/,(m,a,c)=>'<bdi dir="ltr">'+c+'-'+a+'</bdi>')+'<small>صفحة '+p.page+'</small>';b.addEventListener('click',()=>select(p.id,true));box.appendChild(b);btns[p.id]=b;});list.appendChild(g);});
const cover=document.getElementById('cover'),pb=document.getElementById('play'),pic=document.getElementById('pi'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('time');
let t=0,playing=false,last=0,TOTAL=1;const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
window.__ui=t=>{fill.style.width=(t/TOTAL*100)+'%';const ep=document.getElementById('eprogi');if(ep)ep.style.width=(t/TOTAL*100)+'%';tm.textContent=fmt(t)+' / '+fmt(TOTAL);bar.setAttribute('aria-valuenow',Math.round(t));};
function select(id,go){TOTAL=load(id);bar.setAttribute('aria-valuemax',Math.round(TOTAL));Object.entries(btns).forEach(([k,b])=>b.classList.toggle('cur',k===id));t=0;if(go){play();}else render(3);
  try{localStorage.setItem('ch1-last',id);}catch(e){}}
function setIcon(){pic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5l11 7-11 7z"/>';}
function play(){if(t>=TOTAL)t=0;playing=true;cover.hidden=true;last=performance.now();setIcon();requestAnimationFrame(loop);}
function pause(){playing=false;setIcon();}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean')window.__edutokPaused=!d.playing;});
function seek(v){t=Math.max(0,Math.min(TOTAL,v));cover.hidden=true;render(t);}
function loop(now){if(!playing)return;t+=(now-last)/1000;last=now;if(t>=TOTAL){if(EMBED){t=0;last=now;render(0);requestAnimationFrame(loop);return;}t=TOTAL;render(t);pause();return;}render(t);requestAnimationFrame(loop);}
pb.addEventListener('click',()=>playing?pause():play());cover.addEventListener('click',play);
document.getElementById('screen').addEventListener('click',e=>{if(cover.contains(e.target))return;playing?pause():play();});
const seekX=x=>{const r=bar.getBoundingClientRect();seek((r.right-x)/r.width*TOTAL);};let bd=false;
bar.addEventListener('pointerdown',e=>{bd=true;bar.setPointerCapture(e.pointerId);seekX(e.clientX);});bar.addEventListener('pointermove',e=>{if(bd)seekX(e.clientX);});bar.addEventListener('pointerup',()=>bd=false);
let first=PROBS[0]&&PROBS[0].id;try{const l=localStorage.getItem('ch1-last');if(l&&PROBS.some(p=>p.id===l))first=l;}catch(e){}
const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h))first=h;
if(first)select(first,false);
// وضع التضمين: يبدأ تلقائياً، ويستقبل أوامر التشغيل/الإيقاف من التطبيق (النقر على الشاشة)
if(EMBED){
  window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean'){d.playing?play():pause();}});
  const go=()=>{if(!playing&&!window.__edutokPaused)play();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(go,150));else setTimeout(go,400);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h)){pause();select(h,false);}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Promise.all(['700 40px Amiri','600 20px "Noto Naskh Arabic"','20px "STIX Two Text"','500 20px "IBM Plex Mono"'].map(f=>document.fonts.load(f).catch(()=>{})))).then(()=>{if(!playing)render(3);});
})();
</script>
