page":77,"kind":"lc","q":"للتفاعل المتزن الآتي ΔH = 858 kJ، وKp عند 1000K تساوي 7.4 × 10⁻¹⁶. بيّن هل Kp عند 1500K أكبر أم أقل من قيمتها عند 1000K للتفاعل نفسه.","eqs":["2BrF_{5(g)} ⇌ Br_{2(g)} + 5F_{2(g)}     ΔH = +858 kJ"],"lcEq":"2BrF_{5(g)} ⇌ Br_{2(g)} + 5F_{2(g)}   ΔH > 0","lc":{"R":[["BrF5",2,"g"]],"P":[["Br2",1,"g"],["F2",5,"g"]]},"parts":[{"t":"رفع درجة الحرارة من 1000K إلى 1500K","act":"heat","shift":"f","K":"up","why":"ΔH موجبة: التفاعل ماص للحرارة، فرفع الحرارة يزيحه بالاتجاه الأمامي فتزداد النواتج","res":"يُزاح نحو اليمين ← Kp تزداد"}],"answerT":["Kp عند 1500K أكبر من 7.4 × 10⁻¹⁶","لأن التفاعل ماص للحرارة"],"tip":"في التفاعل الماص تُعامَل الحرارة كأنها مادة متفاعلة: زيادتها تدفع التفاعل للأمام"},{"id":"T2-12","label":"تمرين 2-12","page":78,"kind":"lc","q":"يصل مزيج الغازات C₂H₄ وH₂ وC₂H₆ الموضوعة في وعاء مغلق عند 25°C إلى حالة الاتزان كما في التفاعل الآتي. صِف عددًا من الإجراءات التي تؤدي إلى رفع كمية C₂H₆ الناتجة من هذا التفاعل.","eqs":["C_{2}H_{4(g)} + H_{2(g)} ⇌ C_{2}H_{6(g)} + 137 kJ/mol"],"lcEq":"C_{2}H_{4(g)} + H_{2(g)} ⇌ C_{2}H_{6(g)} + 137 kJ","lc":{"R":[["C2H4",1,"g"],["H2",1,"g"]],"P":[["C2H6",1,"g"]]},"parts":[{"t":"إضافة C₂H₄ أو H₂","act":"add","sp":"H2","shift":"f","K":"same","why":"زيادة تركيز المتفاعلات يستهلكها النظام بالاتجاه الأمامي","res":"يُزاح نحو اليمين ← تزداد C₂H₆"},{"t":"سحب C₂H₆ من الإناء","act":"rem","sp":"C2H6","shift":"f","K":"same","why":"نقص الناتج يعوّضه النظام بتكوين المزيد منه","res":"يُزاح نحو اليمين ← تزداد C₂H₆"},{"t":"خفض درجة الحرارة","act":"cool","shift":"f","K":"up","why":"التفاعل باعث للحرارة، فالتبريد يجعله يُطلق حرارة بالاتجاه الأمامي","res":"يُزاح نحو اليمين ← تزداد C₂H₆ وتزداد K"},{"t":"زيادة الضغط (تقليل الحجم)","act":"pUp","shift":"f","K":"same","why":"زيادة الضغط تزيح الاتزان نحو العدد الأقل من المولات: 1 مول C₂H₆ مقابل 2 مول متفاعلات","res":"يُزاح نحو اليمين ← تزداد C₂H₆"}],"answerT":["إضافة C₂H₄ أو H₂","سحب C₂H₆ أولًا بأول","خفض درجة الحرارة","زيادة الضغط"],"tip":"كل إجراء يدفع الاتزان نحو اليمين يرفع كمية C₂H₆"},{"id":"Q2-1","label":"سؤال 2-1","page":79,"kind":"lc","q":"املأ الفراغات في الجمل التالية بما يناسبها: (1) في التفاعل المتزن الأول فإن خفض درجة الحرارة يؤدي إلى زيادة تراكيز المواد ...... (2) في التفاعل المتزن الثاني عندما يُضاف الهيدروجين إلى هذا النظام المتزن فإن حرارة التفاعل ......","eqs":["(1)  N_{2(g)} + 3H_{2(g)} ⇌ 2NH_{3(g)} + 92 kJ","(2)  CO_{(g)} + 2H_{2(g)} ⇌ CH_{3}OH_{(g)} + 127 kJ"],"lcEq":"N_{2(g)} + 3H_{2(g)} ⇌ 2NH_{3(g)} + 92 kJ","lc":{"R":[["N2",1,"g"],["H2",3,"g"]],"P":[["NH3",2,"g"]]},"parts":[{"t":"خفض درجة الحرارة","act":"cool","shift":"f","K":"up","why":"التفاعل باعث للحرارة (الحرارة في جهة النواتج)، فالتبريد يزيحه نحو النواتج","res":"الفراغ: NH₃ (المواد الناتجة)"},{"t":"إضافة H₂ إلى النظام المتزن","rx":{"R":[["CO",1,"g"],["H2",2,"g"]],"P":[["CH3OH",1,"g"]]},"eq":"CO_{(g)} + 2H_{2(g)} ⇌ CH_{3}OH_{(g)} + 127 kJ","act":"add","sp":"H2","shift":"f","K":"same","emit":true,"why":"يُزاح الاتزان نحو اليمين لاستهلاك H₂، والاتجاه الأمامي يُطلق الحرارة","res":"الفراغ: ترتفع (تزداد الحرارة المنبعثة)"}],"answerT":["(1) NH₃ (المواد الناتجة)","(2) ترتفع حرارة التفاعل"],"tip":"في التفاعل الباعث تكون الحرارة كأنها مادة ناتجة"},{"id":"Q2-2-1","label":"سؤال 2-2 (1)","page":80,"kind":"qk","qCam":"dial","ansCam":"dial","tipCam":"dial","kMark":0.0417,"kMarkTag":"K_{c} = 4.17 × 10^{−2}","q":"ثابت الاتزان Kc للتفاعل المتزن الآتي عند 727°C يبلغ 4.17 × 10⁻². فإن اتجاه التفاعل عند خلط 0.4 M من SO₃ و0.1 M من O₂ و0.02 M من SO₂ يكون:","eqs":["2SO_{2(g)} + O_{2(g)} ⇌ 2SO_{3(g)}"],"opts":["(أ) باتجاه المواد المتفاعلة","(ب) باتجاه المواد الناتجة","(ج) التفاعل في حالة اتزان ديناميكي","(د) كل الإجابات السابقة خاطئة"],"rx":{"K":"c","Q":true,"R":[["SO2",2,"g"],["O2",1,"g"]],"P":[["SO3",2,"g"]],"note":"نحسب Q بتراكيز لحظة الخلط ونقارنها بـ K"},"parts":[{"title":"نحسب Q","conc":"[SO_{3}] = 0.4 , [O_{2}] = 0.1 , [SO_{2}] = 0.02","num":"(0.4)^{2}","den":"(0.02)^{2}(0.1)","res":"Q = 4000","Q":4000,"dir":"b","note":"Q > K ← يسير التفاعل باتجاه المواد المتفاعلة"}],"dial":[{"part":0,"off":4.4,"K":4000,"tag":"Q = 4000"},{"part":0,"off":9.2,"K":0.0417,"tag":"Q ⟶ K"}],"answerT":["Q = 4000 أكبر بكثير من K","الاختيار الصحيح: (أ) باتجاه المواد المتفاعلة"],"tip":"Q > K ← للخلف ، Q < K ← للأمام ، Q = K ← اتزان"},{"id":"Q2-2-2","label":"سؤال 2-2 (2)","page":80,"kind":"lc","q":"التفاعل المتزن الآتي يتم في وعاء مغلق، فإن كمية CaCO₃ تزداد عندما: أ) تزال كمية من غاز CO₂ ب) يزداد الضغط الكلي ج) تضاف كمية من CaO د) كل الإجابات السابقة خاطئة","eqs":["CaCO_{3(s)} ⇌ CO_{2(g)} + CaO_{(s)}"],"lcEq":"CaCO_{3(s)} ⇌ CO_{2(g)} + CaO_{(s)}","lc":{"R":[["CaCO3",1,"s"]],"P":[["CO2",1,"g"],["CaO",1,"s"]]},"parts":[{"t":"(أ) إزالة كمية من CO₂","act":"rem","sp":"CO2","shift":"f","K":"same","why":"نقص CO₂ يزيح الاتزان نحو اليمين فيتفكك مزيد من CaCO₃","res":"تقل كمية CaCO₃ ← (أ) خطأ"},{"t":"(ب) زيادة الضغط الكلي","act":"pUp","shift":"b","K":"same","why":"زيادة الضغط تزيح الاتزان نحو الجهة الأقل غازًا، وهي اليسار (لا غاز فيها)","res":"تزداد كمية CaCO₃ ← (ب) صحيح"},{"t":"(ج) إضافة كمية من CaO","act":"add","sp":"CaO","spPh":"s","shift":"0","K":"same","why":"CaO مادة صلبة، وإضافة المادة الصلبة لا تؤثر في موضع الاتزان","res":"لا تتغير كمية CaCO₃ ← (ج) خطأ"}],"answerT":["الاختيار الصحيح: (ب) يزداد الضغط الكلي"],"tip":"المواد الصلبة لا تدخل في قانون الاتزان، فإضافتها أو سحبها لا يزيح الاتزان"},{"id":"Q2-2-3","label":"سؤال 2-2 (3)","page":80,"kind":"conv","ansCam":"exprClose","q":"للتفاعل المتزن الآتي ثابت الاتزان Kc يساوي 1 × 10⁶ بدرجة حرارة 200K. فإذا كان الضغط الجزيئي عند الاتزان 0.2 atm لغاز IF و4 × 10⁻³ atm لغاز F₂، فإن الضغط الجزيئي لغاز I₂ يساوي:","eqs":["I_{2(g)} + F_{2(g)} ⇌ 2IF_{(g)}"],"opts":["(أ) 5 × 10⁴ atm","(ب) 1 × 10⁻⁵ atm","(ج) 1 × 10⁵ atm","(د) كل الإجابات السابقة خاطئة"],"rx":{"K":"p","R":[["I2",1,"g"],["F2",1,"g"]],"P":[["IF",2,"g"]],"vals":{"IF":"0.2","F2":"4 × 10^{−3}"}},"mix":{"IF":14,"F2":1},"givens":[["K_{c}","1 × 10^{6}","عند 200 K"],["P_{IF}","0.2 atm","عند الاتزان","IF"],["P_{F₂}","4 × 10^{−3} atm","عند الاتزان","F2"]],"find":"P_{I₂} = ?","steps":[{"t":"نعدّ مولات الغازات: Δn = 0 فتتساوى Kp وKc","m":["Δn_{g} = 2 − (1 + 1) = 0","K_{p} = K_{c} = 1 × 10^{6}"],"cam":"exprClose","count":true},{"t":"نعوّض الضغوط في قانون Kp","m":[{"f":["1 × 10^{6}","(0.2)^{2}","P_{I₂} (4 × 10^{−3})"]},"P_{I₂} = 0.04 ÷ (4 × 10^{3})","P_{I₂} = 1 × 10^{−5} atm"],"cam":"exprClose","lab":"val"}],"answer":["P_{I₂} = 1 × 10^{−5} atm"],"answerNote":"الاختيار الصحيح: (ب)","tip":"عندما Δn = 0 تتساوى Kp وKc، فنعوّض الضغوط مباشرة"},{"id":"Q2-2-4","label":"سؤال 2-2 (4)","page":80,"kind":"conv","qCam":"dial","givCam":"dial","tipCam":"dial","q":"إذا كانت قيمة Kc للتفاعل الأول عند 300K تساوي 640.3، فإن قيمة Kc للتفاعل الثاني عند درجة الحرارة نفسها تساوي:","eqs":["Li_{(g)} + ½I_{2(g)} ⇌ LiI_{(g)}     K_{c} = 640.3","2LiI_{(g)} ⇌ 2Li_{(g)} + I_{2(g)}     K_{c}′ = ?"],"opts":["(أ) 25.3","(ب) 41 × 10⁴","(ج) 15.6 × 10⁵","(د) كل الإجابات السابقة خاطئة"],"givens":[["K_{c}","640.3","للتفاعل الأول"]],"find":"K_{c}′ = ?","steps":[{"t":"نضرب المعادلة الأولى في 2 فنربّع K","m":["2Li + I_{2} ⇌ 2LiI","K = (640.3)^{2} = 4.1 × 10^{5}"],"cam":"dial"},{"t":"ثم نعكس التفاعل فنقلب K","m":["K_{c}′ = 1 ÷ (4.1 × 10^{5})","K_{c}′ = 2.4 × 10^{−6}"],"cam":"dial"},{"t":"نقارن بالاختيارات: 41 × 10⁴ هي قيمة التفاعل المضاعف قبل عكسه","m":["K_{c}′ = 2.4 × 10^{−6}"],"cam":"dial"}],"dial":[{"at":0,"off":0.6,"K":640.3,"tag":"K_{c} = 640.3"},{"at":0,"K":410000,"tag":"K = 4.1 × 10^{5}"},{"at":1,"K":0.00000244,"tag":"K_{c}′ = 2.4 × 10^{−6}"}],"answer":["K_{c}′ = 2.4 × 10^{−6}"],"answerNote":"الاختيار الصحيح: (د) كل الإجابات السابقة خاطئة","tip":"الضرب في 2 يربّع K، والعكس يقلبه؛ والاختيار (ب) فخ لمن ينسى العكس"},{"id":"Q2-2-5","label":"سؤال 2-2 (5)","page":81,"kind":"conv","q":"للتفاعل المتزن الآتي قيمة Kp عند 25°C تساوي 5.5 × 10⁻⁵، لذا فإن قيمة Kc للتفاعل تساوي:","eqs":["N_{2(g)} + 3H_{2(g)} ⇌ 2NH_{3(g)} + 92 kJ"],"opts":["(أ) 22513.3","(ب) 9 × 10⁴","(ج) 0.03","(د) كل الإجابات السابقة خاطئة"],"rx":{"K":"p","R":[["N2",1,"g"],["H2",3,"g"]],"P":[["NH3",2,"g"]]},"thermo":{"tc":25,"max":400},"mix":{"N2":2,"H2":6,"NH3":2},"givens":[["K_{p}","5.5 × 10^{−5}","عند 25 °C"],["t","25 °C","درجة الحرارة"]],"find":"K_{c} = ?","steps":[{"t":"نحوّل درجة الحرارة إلى كلفن","m":["T = 25 + 273 = 298 K"],"cam":"thermo","thermo":true},{"t":"نعدّ مولات الغازات","m":["Δn_{g} = 2 − (1 + 3) = −2"],"cam":"exprClose","count":true},{"t":"نحوّل Kp إلى Kc","m":["K_{c} = K_{p} (RT)^{2}","K_{c} = 5.5 × 10^{−5} × (0.082 × 298)^{2}","K_{c} = 5.5 × 10^{−5} × 597 = 0.03"],"cam":"dial"}],"dial":[{"at":2,"off":0.6,"K":0.000055,"tag":"K_{p} = 5.5 × 10^{−5}"},{"at":2,"K":0.0328,"tag":"K_{c} = 0.03"}],"answer":["K_{c} = 0.03"],"answerNote":"الاختيار الصحيح: (ج)","tip":"Δn سالب يجعل Kc أكبر من Kp"},{"id":"Q2-2-6","label":"سؤال 2-2 (6)","page":81,"kind":"conv","q":"للتفاعل المتزن الآتي قيمة Kp عند الاتزان 2558.4 بدرجة حرارة 4000K، وقيمة kf للتفاعل بدلالة التراكيز المولارية تساوي 1.56، فإن قيمة kb تساوي:","eqs":["Br_{2(g)} ⇌ 2Br_{(g)}"],"opts":["(أ) 0.2","(ب) 20","(ج) 7.8","(د) كل الإجابات السابقة خاطئة"],"rx":{"K":"p","R":[["Br2",1,"g"]],"P":[["Br",2,"g"]]},"mix":{"Br2":4,"Br":10},"givens":[["K_{p}","2558.4","عند 4000 K"],["T","4000 K","درجة الحرارة"],["k_{f}","1.56","ثابت سرعة الأمامي"]],"find":"k_{b} = ?","steps":[{"t":"نعدّ مولات الغازات","m":["Δn_{g} = 2 − 1 = 1"],"cam":"exprClose","count":true},{"t":"نحوّل Kp إلى Kc","m":["K_{c} = K_{p} ÷ (RT)","K_{c} = 2558.4 ÷ (0.082 × 4000)","K_{c} = 2558.4 ÷ 328 = 7.8"],"cam":"dial"},{"t":"K = kf ÷ kb، فنعزل kb","m":[{"f":["K_{c}","k_{f}","k_{b}"]},"k_{b} = 1.56 ÷ 7.8 = 0.2"],"cam":"dial"}],"dial":[{"at":1,"off":0.6,"K":2558.4,"tag":"K_{p} = 2558.4"},{"at":1,"K":7.8,"tag":"K_{c} = 7.8"}],"answer":["k_{b} = 0.2"],"answerNote":"الاختيار الصحيح: (أ)","tip":"العلاقة K = kf ÷ kb تُستعمل مع Kc (بدلالة التراكيز)"},{"id":"Q2-2-7","label":"سؤال 2-2 (7)","page":81,"kind":"qk","qCam":"dial","ansCam":"dial","tipCam":"dial","kMark":2,"kMarkTag":"K = 2","q":"للتفاعل المتزن الآتي ثابت الاتزان Kp = 2، فإن التفاعل يتجه نحو النواتج عندما تكون التراكيز (بوحدات mole/L) هي:","eqs":["H_{2(g)} + I_{2(g)} ⇌ 2HI_{(g)}"],"opts":["(أ) HI = 0.1 ، I₂ = 0.05 ، H₂ = 0.05","(ب) HI = 0.4 ، I₂ = 0.1 ، H₂ = 0.2","(ج) HI = 0.001 ، I₂ = 0.0002 ، H₂ = 0.0025","(د) كل الإجابات السابقة خاطئة"],"rx":{"K":"c","Q":true,"R":[["H2",1,"g"],["I2",1,"g"]],"P":[["HI",2,"g"]],"note":"Δn = 0 فإن Kc = Kp = 2، ونقارن Q بها"},"parts":[{"title":"الاختيار (أ)","conc":"[HI] = 0.1 , [I_{2}] = 0.05 , [H_{2}] = 0.05","num":"(0.1)^{2}","den":"(0.05)(0.05)","res":"Q = 4","Q":4,"dir":"b","note":"Q > K ← يتجه نحو المتفاعلات، لا النواتج"},{"title":"الاختيار (ب)","conc":"[HI] = 0.4 , [I_{2}] = 0.1 , [H_{2}] = 0.2","num":"(0.4)^{2}","den":"(0.1)(0.2)","res":"Q = 8","Q":8,"dir":"b","note":"Q > K ← يتجه نحو المتفاعلات، لا النواتج"},{"title":"الاختيار (ج)","conc":"[HI] = 0.001 , [I_{2}] = 0.0002 , [H_{2}] = 0.0025","num":"(0.001)^{2}","den":"(0.0002)(0.0025)","res":"Q = 2","Q":2.001,"dir":"eq","note":"Q = K ← التفاعل في حالة اتزان"}],"dial":[{"part":0,"off":4.4,"K":4,"tag":"Q = 4"},{"part":0,"off":9.2,"K":2,"tag":"Q ⟶ K"},{"part":1,"off":4.4,"K":8,"tag":"Q = 8"},{"part":1,"off":9.2,"K":2,"tag":"Q ⟶ K"},{"part":2,"off":4.4,"K":2.001,"tag":"Q = 2"}],"answerT":["(أ) Q = 4 > K ← نحو المتفاعلات","(ب) Q = 8 > K ← نحو المتفاعلات","(ج) Q = 2 = K ← في حالة اتزان","الاختيار الصحيح: (د)"],"tip":"يتجه التفاعل نحو النواتج فقط عندما Q < K"},{"id":"Q2-3","label":"سؤال 2-3","page":81,"kind":"lc","q":"علّل ما يأتي:","eqs":[],"opts":["1- زيادة حجم الإناء لتفاعل غازي فيه Σn للنواتج أقل يخفض الناتج","2- لا تتغير حرارة الإناء بزيادة الضغط عندما Δn = 0","3- ثابت الاتزان للتفاعلات غير الانعكاسية كبير جدًّا","4- ترتفع حرارة تفاعل ماص عندما Kc = 0.3 وQ = 1","5- يُعدّ التفاعل باعثًا إذا قلّت Kc بالتسخين","6- تزداد Kc برفع الحرارة للتفاعلات الماصة","7- زيادة الضغط حين Δn = +1 تزيح الاتزان نحو المتفاعلات","8- تتوقف بعض التفاعلات وتبدو أخرى متوقفة","9- ترتفع الحرارة بإضافة SO₂ إلى خليط SO₂Cl₂"],"lcEq":"N_{2(g)} + 3H_{2(g)} ⇌ 2NH_{3(g)}","lc":{"R":[["N2",1,"g"],["H2",3,"g"]],"P":[["NH3",2,"g"]]},"parts":[{"t":"(1) زيادة حجم الإناء","act":"pDown","shift":"b","K":"same","why":"زيادة الحجم تخفض الضغط، فيُزاح الاتزان نحو العدد الأكبر من المولات الغازية، وهو جهة المتفاعلات هنا","res":"يقل الناتج"},{"t":"(2) زيادة الضغط عندما Δn = 0","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A_{(g)} ⇌ B_{(g)}   (Δn = 0)","act":"pUp","shift":"0","K":"same","why":"عدد المولات الغازية متساوٍ في الطرفين، فلا ينزاح الاتزان، فلا تُمتص حرارة ولا تنبعث","res":"لا تتغير حرارة الإناء"},{"t":"(3) التفاعلات غير الانعكاسية","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A ⟶ B","act":"none","shift":"full","K":"up","why":"تتحول المتفاعلات كلها تقريبًا إلى نواتج، فيكون البسط كبيرًا جدًّا والمقام صغيرًا جدًّا","res":"K كبيرة جدًّا"},{"t":"(4) ماص للحرارة وQ = 1 وKc = 0.3","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A + ΔH ⇌ B   (Q > K)","act":"none","shift":"b","K":"same","emit":true,"why":"Q أكبر من K فيسير التفاعل بالاتجاه الخلفي، وهو الاتجاه الباعث للحرارة لأن الأمامي ماص","res":"تنبعث حرارة فترتفع درجة الحرارة"},{"t":"(5) تقل Kc عند التسخين","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A ⇌ B","act":"heat","shift":"b","K":"down","why":"نقص K بالتسخين يعني انزياح الاتزان نحو المتفاعلات، أي إن الاتجاه الخلفي هو الماص للحرارة","res":"الاتجاه الأمامي باعث للحرارة"},{"t":"(6) تفاعل ماص يُسخَّن","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A + ΔH ⇌ B","act":"heat","shift":"f","K":"up","why":"الاتجاه الأمامي يمتص الحرارة الزائدة، فتزداد النواتج وتقل المتفاعلات","res":"تزداد Kc"},{"t":"(7) زيادة الضغط حين Δn = +1","rx":{"R":[["N2O4",1,"g"]],"P":[["NO2",2,"g"]]},"eq":"N_{2}O_{4(g)} ⇌ 2NO_{2(g)}   (Δn = +1)","act":"pUp","shift":"b","K":"same","why":"زيادة الضغط تزيح الاتزان نحو العدد الأقل من المولات الغازية، وهو جهة المتفاعلات","res":"يُزاح نحو المتفاعلات"},{"t":"(8) تفاعلات تتوقف وأخرى تبدو متوقفة","rx":{"R":[["A",1,"g"]],"P":[["B",1,"g"]]},"eq":"A ⇌ B","act":"none","shift":"0","K":"same","dyn":true,"why":"غير الانعكاسية تتوقف فعلًا بنفاد المتفاعلات، أما في الاتزان فيستمر التفاعلان بسرعتين متساويتين فتبدو التراكيز ثابتة","res":"الاتزان ديناميكي وليس توقفًا"},{"t":"(9) إضافة SO₂","rx":{"R":[["SO2Cl2",1,"g"]],"P":[["SO2",1,"g"],["Cl2",1,"g"]]},"eq":"SO_{2}Cl_{2(g)} + ΔH ⇌ SO_{2(g)} + Cl_{2(g)}","act":"add","sp":"SO2","shift":"b","K":"same","emit":true,"why":"إضافة SO₂ تزيح الاتزان نحو اليسار، والاتجاه الخلفي باعث للحرارة لأن الأمامي ماص","res":"تنبعث حرارة فترتفع درجة الحرارة"}],"answerT":["(1) نحو المولات الأكثر ← يقل الناتج","(2) Δn = 0 ← لا انزياح ولا حرارة","(3) النواتج أكثر بكثير ← K كبيرة","(4) Q > K ← الخلفي الباعث يعمل","(5) K تقل ← الأمامي باعث","(6) الأمامي يمتص الحرارة ← K تزداد","(7) نحو المولات الأقل","(8) الاتزان ديناميكي","(9) الخلفي الباعث يعمل ← ترتفع الحرارة"],"tip":"في كل علّة: حدّد المؤثر، ثم الاتجاه الذي يعاكسه، ثم أثره على الحرارة أو K"},{"id":"Q2-5","label":"سؤال 2-5","page":82,"kind":"lc","q":"للتفاعل المتزن الغازي الباعث للحرارة الآتي، كيف تتغير حالة الاتزان ولماذا: (1) عند زيادة الضغط المسلط على التفاعل المتزن (2) رفع درجة حرارة إناء التفاعل (3) سحب غاز N₂O₄ المتكوّن عند الاتزان.","eqs":["2NO_{2(g)} ⇌ N_{2}O_{4(g)} + حرارة"],"lcEq":"2NO_{2(g)} ⇌ N_{2}O_{4(g)}   ΔH < 0","lc":{"R":[["NO2",2,"g"]],"P":[["N2O4",1,"g"]]},"parts":[{"t":"زيادة الضغط","act":"pUp","shift":"f","K":"same","why":"زيادة الضغط تزيح الاتزان نحو العدد الأقل من المولات الغازية: 1 مول N₂O₄ مقابل 2 مول NO₂","res":"يُزاح نحو اليمين (تكوين N₂O₄) ← K ثابتة"},{"t":"رفع درجة الحرارة","act":"heat","shift":"b","K":"down","why":"التفاعل باعث للحرارة، فرفع الحرارة يزيحه بالاتجاه الخلفي الماص للحرارة","res":"يُزاح نحو اليسار (تكوين NO₂) ← K تقل"},{"t":"سحب N₂O₄ المتكوّن","act":"rem","sp":"N2O4","shift":"f","K":"same","why":"نقص الناتج يعوّضه النظام بتكوين المزيد منه","res":"يُزاح نحو اليمين ← K ثابتة"}],"answerT":["(1) نحو اليمين ← تكوين N₂O₄","(2) نحو اليسار ← K تقل","(3) نحو اليمين ← تعويض N₂O₄"],"tip":"التفاعل باعث للحرارة: الحرارة في جهة النواتج"},{"id":"Q2-6","label":"سؤال 2-6","page":82,"kind":"lc","q":"التفاعل الغازي المتزن الآتي انثالبي التفاعل له تساوي 92.5 kJ/mole. ما تأثير كلٍّ من العوامل التالية على حالة الاتزان وثابت الاتزان: (1) خفض درجة الحرارة (2) إضافة زيادة من Cl₂ (3) سحب PCl₃ (4) زيادة الضغط (5) إضافة عامل مساعد.","eqs":["PCl_{5(g)} ⇌ PCl_{3(g)} + Cl_{2(g)}     ΔH = +92.5 kJ/mol"],"lcEq":"PCl_{5(g)} ⇌ PCl_{3(g)} + Cl_{2(g)}   ΔH > 0","lc":{"R":[["PCl5",1,"g"]],"P":[["PCl3",1,"g"],["Cl2",1,"g"]]},"parts":[{"t":"خفض درجة الحرارة","act":"cool","shift":"b","K":"down","why":"التفاعل ماص للحرارة، فخفض الحرارة يزيحه بالاتجاه الخلفي الباعث لها","res":"يُزاح نحو اليسار ← K تقل"},{"t":"إضافة زيادة من Cl₂","act":"add","sp":"Cl2","shift":"b","K":"same","why":"يستهلك النظام جزءًا من Cl₂ المضاف بالاتجاه الخلفي","res":"يُزاح نحو اليسار ← K ثابتة"},{"t":"سحب PCl₃","act":"rem","sp":"PCl3","shift":"f","K":"same","why":"نقص الناتج يعوّضه النظام بالاتجاه الأمامي","res":"يُزاح نحو اليمين ← K ثابتة"},{"t":"زيادة الضغط","act":"pUp","shift":"b","K":"same","why":"نحو العدد الأقل من المولات الغازية: 1 مول PCl₅ مقابل 2 مول نواتج","res":"يُزاح نحو اليسار ← K ثابتة"},{"t":"إضافة عامل مساعد","act":"cat","shift":"0","K":"same","why":"يسرّع التفاعلين بالدرجة نفسها فيصل إلى الاتزان أسرع","res":"لا تأثير على الاتزان ولا على K"}],"answerT":["(1) نحو اليسار ← K تقل","(2) نحو اليسار ← K ثابتة","(3) نحو اليمين ← K ثابتة","(4) نحو اليسار ← K ثابتة","(5) لا تأثير ← K ثابتة"],"tip":"K تتغير بتغير درجة الحرارة فقط"},{"id":"Q2-7","label":"سؤال 2-7","page":82,"kind":"lc","q":"التفاعل المتزن الآتي انثالبي التفاعل له تساوي −198.2 kJ. ماذا يحدث لتراكيز SO₂ وO₂ وSO₃ عند الاتزان بعد: (1) زيادة درجة حرارة التفاعل (2) تقليل الضغط المسلط على التفاعل (3) زيادة تركيز SO₂ في خليط الاتزان (4) إضافة عامل مساعد.","eqs":["2SO_{2(g)} + O_{2(g)} ⇌ 2SO_{3(g)}     ΔH = −198.2 kJ"],"lcEq":"2SO_{2(g)} + O_{2(g)} ⇌ 2SO_{3(g)}   ΔH < 0","lc":{"R":[["SO2",2,"g"],["O2",1,"g"]],"P":[["SO3",2,"g"]]},"parts":[{"t":"زيادة درجة الحرارة","act":"heat","shift":"b","K":"down","why":"التفاعل باعث للحرارة، فرفع الحرارة يزيحه بالاتجاه الخلفي","res":"[SO₂] و[O₂] تزداد ، [SO₃] تقل ، K تقل"},{"t":"تقليل الضغط","act":"pDown","shift":"b","K":"same","why":"نحو العدد الأكبر من المولات الغازية: 3 مولات متفاعلات مقابل 2 مول SO₃","res":"كمية SO₂ وO₂ تزداد ، كمية SO₃ تقل"},{"t":"زيادة تركيز SO₂","act":"add","sp":"SO2","shift":"f","K":"same","why":"يستهلك النظام جزءًا من SO₂ المضاف مع O₂ لتكوين SO₃","res":"[O₂] تقل ، [SO₃] تزداد ، [SO₂] أعلى من قبل الإضافة"},{"t":"إضافة عامل مساعد","act":"cat","shift":"0","K":"same","why":"يسرّع التفاعلين بالدرجة نفسها فقط","res":"لا تتغير التراكيز عند الاتزان"}],"answerT":["(1) SO₂ وO₂ تزداد ، SO₃ تقل","(2) SO₂ وO₂ تزداد ، SO₃ تقل","(3) O₂ تقل ، SO₃ تزداد","(4) لا تغيير"],"tip":"حدّد أولًا اتجاه الانزياح، ثم المواد التي تُستهلك والتي تتكوّن"},{"id":"Q2-8","label":"سؤال 2-8","page":82,"kind":"lc","q":"هل يؤدي دائمًا رفع درجة حرارة أي تفاعل في حالة اتزان إلى زيادة في تراكيز النواتج؟ إذا كانت إجابتك بالنفي فما التفاعلات التي تؤدي أو لا تؤدي إلى زيادة النواتج؟ بيّن ذلك مع ذكر أمثلة.","eqs":[],"lcEq":"N_{2}O_{4(g)} ⇌ 2NO_{2(g)}   ΔH > 0","lc":{"R":[["N2O4",1,"g"]],"P":[["NO2",2,"g"]]},"parts":[{"t":"تفاعل ماص للحرارة: N₂O₄ ⇌ 2NO₂","act":"heat","shift":"f","K":"up","why":"الاتجاه الأمامي يمتص الحرارة الزائدة","res":"تزداد النواتج ← K تزداد"},{"t":"تفاعل باعث للحرارة: N₂ + 3H₂ ⇌ 2NH₃","rx":{"R":[["N2",1,"g"],["H2",3,"g"]],"P":[["NH3",2,"g"]]},"eq":"N_{2(g)} + 3H_{2(g)} ⇌ 2NH_{3(g)}   ΔH < 0","act":"heat","shift":"b","K":"down","why":"الاتجاه الخلفي هو الذي يمتص الحرارة الزائدة","res":"تقل النواتج ← K تقل"}],"answerT":["لا، ليس دائمًا","الماص للحرارة: رفع الحرارة يزيد النواتج","الباعث للحرارة: رفع الحرارة يقلل النواتج"],"tip":"انظر إلى إشارة ΔH قبل الحكم"},{"id":"Q2-9","label":"سؤال 2-9","page":82,"kind":"lc","q":"للتفاعل المتزن الباعث للحرارة الآتي، وضّح تأثير كلٍّ من العوامل الآتية على حالة الاتزان وقيمة ثابت الاتزان: (1) خفض الضغط المسلط على التفاعل (2) تبريد إناء التفاعل.","eqs":["2PbS_{(s)} + 3O_{2(g)} ⇌ 2PbO_{(s)} + 2SO_{2(g)}"],"lcEq":"2PbS_{(s)} + 3O_{2(g)} ⇌ 2PbO_{(s)} + 2SO_{2(g)}   ΔH < 0","lc":{"R":[["PbS",2,"s"],["O2",3,"g"]],"P":[["PbO",2,"s"],["SO2",2,"g"]]},"parts":[{"t":"خفض الضغط","act":"pDown","shift":"b","K":"same","why":"نعدّ الغازات فقط: 3 مول O₂ مقابل 2 مول SO₂، فخفض الضغط يزيح الاتزان نحو العدد الأكبر","res":"يُزاح نحو اليسار ← K ثابتة"},{"t":"تبريد إناء التفاعل","act":"cool","shift":"f","K":"up","why":"التفاعل باعث للحرارة، فالتبريد يزيحه بالاتجاه الأمامي الباعث","res":"يُزاح نحو اليمين ← K تزداد"}],"answerT":["(1) نحو اليسار ← K ثابتة","(2) نحو اليمين ← K تزداد"],"tip":"المواد الصلبة PbS وPbO لا تُعدّ عند دراسة أثر الضغط"},{"id":"Q2-10","label":"سؤال 2-10","page":83,"kind":"lc","q":"التفاعل الماص للحرارة الآتي يجري في إناء مغلق. ماذا يحدث للتفاعل المتزن عند: (1) تقليل حجم الإناء (2) إضافة مزيد من CaO (3) سحب جزء من CaCO₃ (4) إضافة مزيد من CO₂ (5) زيادة درجة الحرارة.","eqs":["CaCO_{3(s)} ⇌ CO_{2(g)} + CaO_{(s)}     ΔH > 0"],"lcEq":"CaCO_{3(s)} ⇌ CO_{2(g)} + CaO_{(s)}   ΔH > 0","lc":{"R":[["CaCO3",1,"s"]],"P":[["CO2",1,"g"],["CaO",1,"s"]]},"parts":[{"t":"تقليل حجم الإناء","act":"pUp","shift":"b","K":"same","why":"تقليل الحجم يزيد الضغط، فيُزاح الاتزان نحو الجهة الأقل غازًا (اليسار)","res":"يُزاح نحو اليسار ← K ثابتة"},{"t":"إضافة مزيد من CaO","act":"add","sp":"CaO","spPh":"s","shift":"0","K":"same","why":"CaO مادة صلبة لا تدخل في قانون الاتزان","res":"لا يتأثر الاتزان"},{"t":"سحب جزء من CaCO₃","act":"remS","sp":"CaCO3","shift":"0","K":"same","why":"CaCO₃ مادة صلبة لا تدخل في قانون الاتزان","res":"لا يتأثر الاتزان"},{"t":"إضافة مزيد من CO₂","act":"add","sp":"CO2","shift":"b","K":"same","why":"يستهلك النظام جزءًا من CO₂ المضاف بالاتجاه الخلفي","res":"يُزاح نحو اليسار ← K ثابتة"},{"t":"زيادة درجة الحرارة","act":"heat","shift":"f","K":"up","why":"التفاعل ماص للحرارة، فيمتص الحرارة الزائدة بالاتجاه الأمامي","res":"يُزاح نحو اليمين ← K تزداد"}],"answerT":["(1) نحو اليسار","(2) لا تأثير","(3) لا تأثير","(4) نحو اليسار","(5) نحو اليمين ← K تزداد"],"tip":"Kp = P(CO₂) فقط، لأن CaCO₃ وCaO صلبان"},{"id":"Q2-11","label":"سؤال 2-11","page":83,"kind":"conv","q":"عند تسخين غاز NOCl النقي إلى 24 const cover=document.getElementById('cover'),pb=document.getElementById('play'),pic=document.getElementById('pi'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('time'),screen=document.getElementById('screen');
let t=0,playing=false,last=0,TOTAL=1;const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

function setIcon(){pic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5l11 7-11 7z"/>';}

function pause(){playing=false;setIcon();}
function seek(v){t=Math.max(0,Math.min(TOTAL,v));cover.hidden=true;render(t);}
function loop(now){if(!playing)return;t+=Math.min(.05,(now-last)/1000);last=now;if(t>=TOTAL){if(EMBED){t=0;last=now;render(0);requestAnimationFrame(loop);return;}t=TOTAL;render(t);pause();return;}render(t);requestAnimationFrame(loop);}
