<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأحياء: الخلية ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#ecefee;--panel:#ffffff;--fg:#141c1e;--muted:#5b686b;--line:#d2dbdc;--accent:#0e6b60}
@media (prefers-color-scheme: dark){:root{--bg:#0a0f11;--panel:#11181b;--fg:#e6ecea;--muted:#8c9c9c;--line:#243336;--accent:#5fcab9}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","DejaVu Sans",serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:"Amiri",serif;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.25}
.lede{margin:2px 0 0;color:var(--muted);line-height:1.8;max-width:64ch}
.list{display:flex;flex-direction:column;gap:14px;min-width:0}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;text-align:start}
.item small{display:block;color:var(--muted);font-size:12px}
.item.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px}
@media (max-width:860px){.player{position:static;order:-1}}
.screen{position:relative;background:#05090c;aspect-ratio:9/16;width:100%;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;cursor:pointer}
.cover span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.cover svg{width:40px;height:40px}
.controls{display:flex;align-items:center;gap:12px;padding:10px 14px}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn svg{width:20px;height:20px;fill:#fff}
.bar{flex:1;height:30px;position:relative;cursor:pointer;direction:rtl}
.bar .track{position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line);border-radius:2px}
.bar .fill{position:absolute;top:13px;right:0;height:4px;background:var(--accent);border-radius:2px}
.time{font:12px ui-monospace,monospace;color:var(--muted);direction:ltr;min-width:74px;text-align:end}
.hint{margin:0;padding:0 14px 12px;font-size:12px;color:var(--muted)}
/* وضع التضمين داخل تطبيق EduTok: بدون عنوان ولا قائمة ولا أزرار، المشهد فقط */
html.embed,html.embed body{background:#04121a;margin:0;padding:0;overflow:hidden;height:100%}
html.embed .wrap{display:block;max-width:none;padding:0;margin:0}
html.embed header,html.embed .list,html.embed .controls,html.embed .cover,html.embed .hint{display:none!important}
html.embed .player{border:0;border-radius:0;position:static;background:#04121a;height:100vh;height:100dvh}
html.embed .screen{aspect-ratio:auto;height:100%;width:100%}
html.embed .screen canvas{object-fit:contain}
.eprog{display:none}
html.embed .eprog{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:5}
html.embed .eprog i{position:absolute;top:0;bottom:0;right:0;width:0;background:#5fcab9}
</style>
</head>
<body>
<div class="wrap" dir="rtl">
  <header>
    <h1>الأحياء: الخلية</h1>
    <p class="lede">مقاطع تفاعلية مجسّمة للصفحة 7 من كتاب الأحياء. اختر المقطع من القائمة، واسحب على الشاشة لتدوير المجسّم.</p>
  </header>
  <div class="list" id="list"><div class="items" id="items"></div></div>
  <div class="player">
    <div class="screen" id="screen">
      <canvas id="cv" width="720" height="1280" aria-label="مقطع تعليمي مجسّم"></canvas>
      <div class="eprog"><i id="eprogi"></i></div>
      <button class="cover" id="cover" aria-label="تشغيل"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play" aria-label="تشغيل"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5l11 7-11 7z"/></svg></button>
      <div class="bar" id="bar" tabindex="0" role="slider" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuenow="0"><div class="track"></div><div class="fill" id="fill" style="width:0"></div></div>
      <span class="time" id="time">0:00</span>
    </div>
    <p class="hint">ضغطة خفيفة للتشغيل والإيقاف، وسحب لتدوير المجسّم.</p>
  </div>
</div>

<script>
(function(){
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED)document.documentElement.classList.add('embed');
const W=720,H=1280;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,u)=>a+(b-a)*u,smooth=u=>u*u*u*(u*(u*6-15)+10);
const fin=(t,a,b,f=.5)=>Math.min(clamp((t-a)/f),1-clamp((t-b+f)/f));
let seed=5;const rng=()=>(seed=(seed*16807)%2147483647)/2147483647;
const FT='"Amiri","Noto Naskh Arabic","DejaVu Sans",serif',FB='"Noto Naskh Arabic","DejaVu Sans",sans-serif',FL='"IBM Plex Mono","DejaVu Sans",monospace';

// ================= نص عربي على Canvas =================
function wrap(text,maxW,font,dir){ctx.font=font;ctx.direction=dir||'rtl';const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;}
function txt(text,x,y,o){o=o||{};const size=o.size||34,color=o.color||'#fff',weight=o.weight||'600',maxW=o.maxW||620,lh=o.lh||1.5,alpha=o.alpha===undefined?1:o.alpha,font=o.font||FB,dir=o.dir||'rtl',align=o.align||'center';
  if(alpha<=0)return 0;const f=weight+' '+size+'px '+font;const lines=wrap(text,maxW,f,dir);
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction=dir;ctx.font=f;
  if(o.shadow){ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;}
  const h=lines.length*size*lh;lines.forEach((l,i)=>ctx.fillText(l,x,y-h/2+size*lh*(i+.5)));ctx.restore();return h;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function subtitle(text,a){if(a<=0)return;const size=32,maxW=590;const lines=wrap(text,maxW,'600 '+size+'px '+FB,'rtl');const h=lines.length*size*1.55+40;
  ctx.save();ctx.globalAlpha=a*.92;ctx.fillStyle='rgba(2,14,20,.72)';rrect(40,1232-h,640,h,26);ctx.fill();ctx.strokeStyle='rgba(95,202,185,.35)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  txt(text,360,1232-h/2,{size,maxW,alpha:a,lh:1.55,weight:'600'});}
function head(ar,en,a){txt(ar,360,150,{size:ar.length>19?44:ar.length>14?50:58,weight:'700',font:FT,alpha:a,shadow:1});if(en)txt(en,360,222,{size:32,color:'#5fcab9',dir:'ltr',alpha:a,font:FL,weight:'500'});}

// ================= خلفية =================
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06202b');g.addColorStop(.55,'#0a3a44');g.addColorStop(1,'#071a22');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.fillStyle='#bfeee6';for(let i=0;i<46;i++){const x=(i*127+t*(6+i%5*3))%W,y=(i*211+(t*(4+i%4*2)*(i%2?-1:1))+H*4)%H,r=1.5+(i%4);ctx.globalAlpha=.07+.05*((i%3));ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}ctx.restore();}

// ================= محرك مجسّمات بسيط (Canvas 2D) =================
let yaw=0,pitch=-.25,userYaw=0,userPitch=0;
const spr=new Map();
function sprite(c){const k=c.join(',');if(spr.has(k))return spr.get(k);const S=96,cc=document.createElement('canvas');cc.width=cc.height=S;const x=cc.getContext('2d');
  const g=x.createRadialGradient(S*.36,S*.33,S*.04,S/2,S/2,S/2);
  const L=v=>Math.min(255,v*1.25+60)|0;g.addColorStop(0,'rgb('+L(c[0])+','+L(c[1])+','+L(c[2])+')');g.addColorStop(.55,'rgb('+c[0]+','+c[1]+','+c[2]+')');g.addColorStop(1,'rgb('+(c[0]*.42|0)+','+(c[1]*.42|0)+','+(c[2]*.42|0)+')');
  x.fillStyle=g;x.beginPath();x.arc(S/2,S/2,S/2-1,0,7);x.fill();spr.set(k,cc);return cc;}
function P(x,y,z,cx,cy,s){const cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let X=x*cyw+z*syw,Z=-x*syw+z*cyw;const Y=y*cp-Z*sp;Z=y*sp+Z*cp;const f=1100/(1100+Z*s);return {x:cx+X*s*f,y:cy+Y*s*f,z:Z,f:s*f};}
let items=[];
function ball(x,y,z,r,col,a,cx,cy,s){const p=P(x,y,z,cx,cy,s);items.push({z:p.z,p,r,col,a});return p;}
function flush(){items.sort((a,b)=>b.z-a.z);for(const it of items){const R=it.r*it.p.f;if(R<.4)continue;ctx.globalAlpha=it.a;ctx.drawImage(sprite(it.col),it.p.x-R,it.p.y-R,R*2,R*2);}ctx.globalAlpha=1;items=[];}
function fib(n,R){const o=[];const ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),th=ga*i;o.push([Math.cos(th)*r*R,y*R,Math.sin(th)*r*R]);}return o;}

// ---------- نموذج الخلية حقيقية النواة ----------
const NUC=[-45,-25,15];
const EUK={memb:fib(280,262),env:fib(120,100).map(p=>[p[0]+NUC[0],p[1]+NUC[1],p[2]+NUC[2]]),mito:[],er:[],golgi:[],ribo:[],ves:[],chrom:[]};
[[[140,70,-50],[.8,.5,.3]],[[-135,105,75],[.3,-.9,.2]],[[45,150,-120],[-.9,.2,.4]],[[-110,-120,-90],[.7,-.3,.6]]].forEach(m=>{const d=m[1],n=Math.hypot(d[0],d[1],d[2]);const ch=[];for(let k=-2;k<=2;k++){const u=k/2;ch.push([m[0][0]+d[0]/n*u*58,m[0][1]+d[1]/n*u*58,m[0][2]+d[2]/n*u*58,k===-2||k===2?16:22]);}EUK.mito.push(ch);});
for(let k=0;k<=70;k++){const h=-.94+1.88*k/70,ang=k*.52,rr=Math.sqrt(1-h*h);EUK.er.push([NUC[0]+128*rr*Math.cos(ang),NUC[1]+128*h,NUC[2]+128*rr*Math.sin(ang)]);}
for(let k=0;k<4;k++){const arc=[];for(let i=-4;i<=4;i++){const u=i/4;arc.push([110+u*72+k*8,-118-u*u*20+k*22,60+k*10]);}EUK.golgi.push(arc);}
for(let i=0;i<70;i++){const p=fib(1,1)[0];const a=rng()*6.28,b=Math.acos(2*rng()-1),r=40+rng()*185;const q=[r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)];if(Math.hypot(q[0]-NUC[0],q[1]-NUC[1],q[2]-NUC[2])>150)EUK.ribo.push(q);}
for(let i=0;i<6;i++){const a=rng()*6.28,b=Math.acos(2*rng()-1),r=120+rng()*90;const q=[r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)];if(Math.hypot(q[0]-NUC[0],q[1]-NUC[1],q[2]-NUC[2])>140)EUK.ves.push(q);}
for(let i=0;i<16;i++){const a=rng()*6.28,b=Math.acos(2*rng()-1),r=rng()*62;EUK.chrom.push([NUC[0]+r*Math.sin(b)*Math.cos(a),NUC[1]+r*Math.cos(b),NUC[2]+r*Math.sin(b)*Math.sin(a)]);}
function euk(cx,cy,s,a,hl){
  for(const q of EUK.memb)ball(q[0],q[1],q[2],11,[105,160,235],a*.5,cx,cy,s);
  for(const q of EUK.env)ball(q[0],q[1],q[2],6.5,[200,165,235],a*.8,cx,cy,s);
  ball(NUC[0]+14,NUC[1]+8,NUC[2]-20,31,[95,60,150],a,cx,cy,s);
  for(const q of EUK.chrom)ball(q[0],q[1],q[2],7,[215,160,240],a*.9,cx,cy,s);
  for(const ch of EUK.mito)for(const q of ch)ball(q[0],q[1],q[2],q[3],[245,150,60],a,cx,cy,s);
  for(const q of EUK.er)ball(q[0],q[1],q[2],7,[90,205,170],a,cx,cy,s);
  for(const arc of EUK.golgi)for(const q of arc)ball(q[0],q[1],q[2],9,[245,215,90],a,cx,cy,s);
  for(const q of EUK.ribo)ball(q[0],q[1],q[2],4.5,[235,120,160],a,cx,cy,s);
  for(const q of EUK.ves)ball(q[0],q[1],q[2],15,[130,200,250],a,cx,cy,s);
  if(hl>0)ball(NUC[0],NUC[1],NUC[2]-60,170,[255,235,130],a*.28*hl,cx,cy,s);
}
const eukAnchor={nuc:NUC,mito:EUK.mito[0][2],golgi:[EUK.golgi[1][4][0],EUK.golgi[1][4][1],EUK.golgi[1][4][2]]};

// ---------- نموذج الخلية بدائية النواة (عصوية) ----------
const PRO={wall:[],nucleoid:[],plasmid:[],ribo:[]};
for(let xi=-150;xi<=150;xi+=30)for(let k=0;k<16;k++){const a=k/16*6.2832;PRO.wall.push([xi,100*Math.cos(a),100*Math.sin(a)]);}
[-1,1].forEach(sg=>{fib(90,100).forEach(p=>{if(p[0]*sg>12)PRO.wall.push([p[0]+150*sg,p[1],p[2]]);});});
for(let k=0;k<170;k++){const u=k/170*6.2832;PRO.nucleoid.push([68*Math.sin(3*u)+40*Math.sin(5*u+1),44*Math.cos(2*u)+30*Math.sin(7*u),44*Math.sin(4*u+.5)+25*Math.cos(3*u)]);}
[[-102,38,22,0],[104,-42,-18,1]].forEach(c=>{for(let k=0;k<16;k++){const a=k/16*6.2832;PRO.plasmid.push([c[0],c[1]+22*Math.cos(a),c[2]+22*Math.sin(a)]);}});
for(let i=0;i<64;i++){const q=[(rng()*2-1)*205,(rng()*2-1)*78,(rng()*2-1)*78];if(Math.hypot(q[1],q[2])<80)PRO.ribo.push(q);}
function pro(cx,cy,s,a){
  for(const q of PRO.wall)ball(q[0],q[1],q[2],9.5,[110,200,140],a*.5,cx,cy,s);
  for(const q of PRO.nucleoid)ball(q[0],q[1],q[2],7.2,[250,115,165],a,cx,cy,s);
  for(const q of PRO.plasmid)ball(q[0],q[1],q[2],5.2,[255,225,120],a,cx,cy,s);
  for(const q of PRO.ribo)ball(q[0],q[1],q[2],4.6,[235,150,90],a,cx,cy,s);
}
// لافتة تشير لنقطة بالمجسّم
function project(pt,cx,cy,s){return P(pt[0],pt[1],pt[2],cx,cy,s);}
function callout(pt,cx,cy,s,label,sub,lx,ly,a,w,col){if(a<=0)return;const p=project(pt,cx,cy,s);col=col||'#fbbf24';
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lerp(lx,p.x,clamp(a*1.4)),lerp(ly,p.y,clamp(a*1.4)));ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  const th=txt(label,lx,ly,{size:27,maxW:w-30,alpha:0,weight:'700'});
  const lines=wrap(label,w-30,'700 27px '+FB,'rtl');const bh=lines.length*42+(sub?34:0)+22;
  ctx.save();ctx.globalAlpha=a*.95;ctx.fillStyle='rgba(2,14,20,.82)';rrect(lx-w/2,ly-bh/2,w,bh,18);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  txt(label,lx,ly-(sub?17:0),{size:27,maxW:w-30,alpha:a,weight:'700',color:'#fff'});
  if(sub)txt(sub,lx,ly+bh/2-30,{size:22,maxW:w-30,alpha:a,dir:'ltr',font:FL,weight:'500',color:col});}

// ================= المقطع 1: أنواع الخلية =================
const T1=50;
function R1(t){
  bg(t);yaw=t*.28+userYaw;pitch=-.25+userPitch;
  // 0-5.4 مقدمة: خلية حقيقية النواة صغيرة + عنوان
  const aI=fin(t,0,5.4,.7);
  if(aI>0){euk(360,790,.82,aI,0);flush();head('الخلية','Cell',aI);txt('الوحدة التركيبية لجميع الكائنات الحية',360,310,{size:36,alpha:aI,maxW:600,shadow:1});}
  // 5.4-9: نوعان
  const aN=fin(t,5.4,9.2,.6);
  if(aN>0){txt('تُقسَم الخلايا إلى نوعين',360,170,{size:50,font:FT,weight:'700',alpha:aN,shadow:1});txt('من حيث التركيب',360,240,{size:34,alpha:aN,color:'#5fcab9'});
    pro(190,700,.45,aN);euk(535,700,.56,aN,0);flush();
    ctx.save();ctx.globalAlpha=aN;[[535,'1','حقيقية النواة'],[190,'2','بدائية النواة']].forEach(([x,n,l])=>{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(x,880,28,0,7);ctx.fill();ctx.fillStyle='#04121a';ctx.font='700 32px '+FL;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(n==='1'?'٢':'١',x,882);});ctx.restore();
    txt('بدائية النواة',190,945,{size:34,alpha:aN,weight:'700'});txt('حقيقية النواة',535,945,{size:34,alpha:aN,weight:'700'});}
  // 9.2-25 بدائية النواة
  const aP=fin(t,9.2,25,.7);
  if(aP>0){head('الخلية بدائية النواة','Prokaryotic Cell',aP);pro(360,640,1.38,aP);flush();
    callout([0,0,0],360,640,1.38,'مادة وراثية حرّة، بلا غلاف نووي','',190,340,aP*fin(t,12.5,25,.5),330);
    callout([135,5,5],360,640,1.38,'لا توجد عضيات غشائية','Membranous Organelles',520,940,aP*fin(t,17.5,25,.5),330);
    subtitle('كما في الخلية البكتيرية: تفتقد الغلاف (الغشاء) النووي والعضيات الغشائية',aP*fin(t,10,25,.5));}
  // 25-41 حقيقية النواة
  const aE=fin(t,25,41,.7);
  if(aE>0){head('الخلية حقيقية النواة','Eukaryotic Cell',aE);euk(360,650,.95,aE,0);flush();
    callout(eukAnchor.nuc,360,650,.95,'نواة واضحة محاطة بغلاف نووي','',190,340,aE*fin(t,28.5,41,.5),330);
    callout(eukAnchor.mito,360,650,.95,'عضيات الخلية','Membranous Organelles',530,960,aE*fin(t,34,41,.5),330);
    subtitle('لها نواة واضحة محاطة بغلاف نووي وعضيات الخلية',aE*fin(t,26,41,.5));}
  // 41-50 مقارنة
  const aS=fin(t,41,T1+1,.7);
  if(aS>0){txt('المقارنة',360,130,{size:56,font:FT,weight:'700',alpha:aS,shadow:1});

function pinchEll(cx,cy,hw,hl,k,horiz){const N=60,pts=[];for(let i=0;i<=N;i++){const u=-1+2*i/N,w=hw*Math.sqrt(Math.max(0,1-u*u))*(1-.97*k*Math.exp(-Math.pow(u/.2,2)));pts.push([u*hl,w]);}
  ctx.beginPath();const P=(l,w)=>horiz?[cx+l,cy+w]:[cx+w,cy+l];let p=P(pts[0][0],pts[0][1]);ctx.moveTo(p[0],p[1]);for(const q of pts){p=P(q[0],q[1]);ctx.lineTo(p[0],p[1]);}for(let i=N;i>=0;i--){p=P(pts[i][0],-pts[i][1]);ctx.lineTo(p[0],p[1]);}ctx.closePath();}
function Xc(x,y,L,rot,c1,c2,w,tip){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineCap='round';ctx.lineWidth=w;ctx.strokeStyle=c1;ctx.beginPath();ctx.moveTo(-w*.9,-L/2);ctx.lineTo(w*.9,L/2);ctx.stroke();ctx.strokeStyle=c2;ctx.beginPath();ctx.moveTo(w*.9,-L/2);ctx.lineTo(-w*.9,L/2);ctx.stroke();if(tip){ctx.fillStyle=tip;ctx.beginPath();ctx.arc(w*.9,-L/2+2,w*.65,0,7);ctx.fill();ctx.beginPath();ctx.arc(-w*.9,L/2-2,w*.65,0,7);ctx.fill();}ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(0,0,w*.7,0,7);ctx.fill();ctx.restore();}
function Vc(x,y,L,dx,dy,col,w){ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=col;const ax=-dx*L/2,ay=-dy*L/2,px=-dy*w*1.3,py=dx*w*1.3;ctx.beginPath();ctx.moveTo(ax-px,ay-py);ctx.lineTo(0,0);ctx.lineTo(ax+px,ay+py);ctx.stroke();ctx.restore();}
function centro(x,y,sc,al){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#fde047';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<4;k++){ctx.moveTo(x+Math.cos(k*.785)*9*sc,y+Math.sin(k*.785)*9*sc);ctx.lineTo(x-Math.cos(k*.785)*9*sc,y-Math.sin(k*.785)*9*sc);}ctx.stroke();ctx.restore();}

let cur=null;
function load(id){cur=PROBS.find(p=>p.id===id)||PROBS[0];userYaw=0;userPitch=0;return cur.total;}
function render(t){if(!cur)return;t=Math.max(0,Math.min(cur.total,t));ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);cur.fn(t);if(window.__ui)window.__ui(t);}
window.__load=load;window.__render=render;

// ================= واجهة الصفحة =================
const itemsBox=document.getElementById('items');const btns={};
PROBS.forEach(p=>{const b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=p.label+'<small>صفحة '+p.page+'</small>';b.addEventListener('click',()=>select(p.id,true));itemsBox.appendChild(b);btns[p.id]=b;});
const cover=document.getElementById('cover'),pb=document.getElementById('play'),pic=document.getElementById('pi'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('time'),screen=document.getElementById('screen');
let t=0,playing=false,last=0,TOTAL=1;const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
window.__ui=tt=>{fill.style.width=(tt/TOTAL*100)+'%';const ep=document.getElementById('eprogi');if(ep)ep.style.width=(tt/TOTAL*100)+'%';tm.textContent=fmt(tt)+' / '+fmt(TOTAL);bar.setAttribute('aria-valuenow',Math.round(tt));};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean')window.__edutokPaused=!d.playing;});
function select(id,go){TOTAL=load(id);bar.setAttribute('aria-valuemax',Math.round(TOTAL));Object.entries(btns).forEach(([k,b])=>b.classList.toggle('cur',k===id));t=0;if(go)play();else render(6);}
function setIcon(){pic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5l11 7-11 7z"/>';}
function play(){if(t>=TOTAL)t=0;playing=true;cover.hidden=true;last=performance.now();setIcon();requestAnimationFrame(loop);}
function pause(){playing=false;setIcon();}
function seek(v){t=Math.max(0,Math.min(TOTAL,v));cover.hidden=true;render(t);}
function loop(now){if(!playing)return;t+=Math.min(.05,(now-last)/1000);last=now;if(t>=TOTAL){if(EMBED){t=0;last=now;render(0);requestAnimationFrame(loop);return;}t=TOTAL;render(t);pause();return;}render(t);requestAnimationFrame(loop);}
pb.addEventListener('click',()=>playing?pause():play());cover.addEventListener('click',play);
let drag=null;
screen.addEventListener('pointerdown',e=>{if(cover.contains(e.target))return;drag={x:e.clientX,y:e.clientY,yaw:userYaw,pitch:userPitch,moved:false};screen.setPointerCapture(e.pointerId);});
screen.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;userYaw=drag.yaw-dx*.01;userPitch=Math.max(-.7,Math.min(.7,drag.pitch-dy*.006));if(!playing)render(t);});
screen.addEventListener('pointerup',()=>{if(drag&&!drag.moved){playing?pause():play();}drag=null;});
screen.addEventListener('pointercancel',()=>{drag=null;});
const seekX=x=>{const r=bar.getBoundingClientRect();seek((r.right-x)/r.width*TOTAL);};let bd=false;
bar.addEventListener('pointerdown',e=>{bd=true;bar.setPointerCapture(e.pointerId);seekX(e.clientX);});bar.addEventListener('pointermove',e=>{if(bd)seekX(e.clientX);});bar.addEventListener('pointerup',()=>bd=false);
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;if(e.key===' '){e.preventDefault();playing?pause():play();}else if(e.key==='ArrowLeft')seek(t+5);else if(e.key==='ArrowRight')seek(t-5);});
let first=PROBS[0].id;const h=location.hash.slice(1);if(PROBS.some(p=>p.id===h))first=h;select(first,false);
window.addEventListener('hashchange',()=>{const hh=location.hash.slice(1);if(PROBS.some(p=>p.id===hh)){pause();select(hh,false);}});
// وضع التضمين: يبدأ تلقائياً، ويستقبل أوامر التشغيل/الإيقاف من التطبيق
if(EMBED){
  window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d&&d.edutok===true&&typeof d.playing==='boolean'){d.playing?play():pause();}});
  const go=()=>{if(!playing&&!window.__edutokPaused)play();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(go,150));else setTimeout(go,400);
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!playing)render(t||6);});
})();
